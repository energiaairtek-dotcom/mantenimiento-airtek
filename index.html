<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airtek · PM Zulia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #eef1f6;
            --surface:   #ffffff;
            --border:    #dde3ed;
            --primary:   #0d9488;
            --primary-d: #0f766e;
            --primary-l: #ccfbf1;
            --accent:    #06b6d4;
            --danger:    #ef4444;
            --warn:      #f59e0b;
            --info:      #3b82f6;
            --dark:      #0d1b2a;
            --dark2:     #162032;
            --text:      #0d1b2a;
            --muted:     #64748b;
            --sh:        0 2px 12px rgba(13,26,42,.07), 0 1px 3px rgba(13,26,42,.05);
            --sh-h:      0 8px 32px rgba(13,148,136,.14), 0 2px 8px rgba(13,26,42,.07);
            --sh-pop:    0 20px 60px rgba(13,26,42,.18), 0 4px 16px rgba(13,26,42,.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse 90% 50% at 50% -5%, rgba(13,148,136,.07) 0%, transparent 55%);
            color: var(--text);
            text-transform: uppercase;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .app-header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
            border-bottom: 1px solid rgba(13,148,136,.3);
            box-shadow: 0 4px 28px rgba(13,26,42,.35);
            position: sticky; top: 0; z-index: 60;
        }
        .logo-ring {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 14px; padding: 10px; color: #fff;
            box-shadow: 0 4px 16px rgba(13,148,136,.4);
        }
        .header-title { font-size: 1.2rem; font-weight: 900; letter-spacing: -.02em; color: #fff; }
        .header-badge { font-size: .58rem; font-weight: 800; background: rgba(13,148,136,.2); color: #5eead4; border: 1px solid rgba(13,148,136,.3); padding: 2px 8px; border-radius: 999px; letter-spacing: .12em; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; }
        .online  { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); animation: pulse-g 2s infinite; }
        .offline { background: #ef4444; }
        .status-lbl { font-size: .6rem; font-weight: 700; letter-spacing: .12em; }
        .online-lbl  { color: #86efac; }
        .offline-lbl { color: #fca5a5; }
        .mode-btn {
            font-size: .6rem; font-weight: 800; letter-spacing: .1em; padding: 6px 14px;
            border-radius: 999px; border: none; cursor: pointer; transition: all .2s;
        }
        .mode-active   { background: linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow: 0 2px 12px rgba(13,148,136,.35); }
        .mode-inactive { background: rgba(255,255,255,.08); color: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.1); }

        /* ── STATS BAR ── */
        .stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 10px; text-align: center; box-shadow: var(--sh); transition: all .2s; cursor: default; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--sh-h); }
        .stat-num { font-size: 1.3rem; font-weight: 900; line-height: 1; }
        .stat-lbl { font-size: .55rem; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin-top: 3px; }
        .stat-pending   .stat-num { color: #f97316; }
        .stat-executing .stat-num { color: var(--info); }
        .stat-overdue   .stat-num { color: var(--danger); }
        .stat-done      .stat-num { color: var(--primary); }

        /* ── FILTER BAR ── */
        .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; box-shadow: var(--sh); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-select { font-family: 'Exo 2',sans-serif; font-size: .62rem; font-weight: 700; text-transform: uppercase; background: #f8fafc; border: 1.5px solid var(--border); border-radius: 10px; padding: 7px 12px; outline: none; color: var(--text); cursor: pointer; transition: border-color .18s; appearance: none; }
        .filter-select:focus { border-color: var(--primary); }
        .filter-lbl { font-size: .58rem; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
        .filter-clear { font-size: .58rem; font-weight: 800; letter-spacing: .1em; padding: 7px 12px; background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; border-radius: 10px; cursor: pointer; transition: all .18s; }
        .filter-clear:hover { background: #fee2e2; }
        .today-btn { font-size: .58rem; font-weight: 800; letter-spacing: .1em; padding: 7px 14px; background: linear-gradient(135deg,var(--primary),var(--primary-d)); color: #fff; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 2px 8px rgba(13,148,136,.3); transition: all .18s; }
        .today-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(13,148,136,.4); }

        /* ── TABS ── */
        .tab-nav { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 5px; display: flex; gap: 4px; box-shadow: var(--sh); overflow-x: auto; }
        .tab-nav::-webkit-scrollbar { display: none; }
        .tab-btn { flex:1; min-width:90px; padding:11px 8px; border-radius:13px; border:none; cursor:pointer; font-family:'Exo 2',sans-serif; font-size:.6rem; font-weight:800; letter-spacing:.1em; white-space:nowrap; transition:all .2s; text-transform:uppercase; }
        .tab-active   { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; box-shadow:0 4px 16px rgba(13,148,136,.3); }
        .tab-inactive { background:transparent; color:var(--muted); }
        .tab-inactive:hover { background:#f0fdf9; color:var(--primary); }

        /* ── CARD ── */
        .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; box-shadow:var(--sh); }
        .card-xl { border-radius:28px; }
        .card:hover { box-shadow:var(--sh-h); }

        /* ── CALENDAR ── */
        .cal-hdr { font-size:.68rem; font-weight:900; letter-spacing:.15em; color:var(--text); }
        .cal-day-lbl { font-size:.58rem; font-weight:800; letter-spacing:.1em; color:var(--muted); text-align:center; padding:4px 0; }
        .cal-cell {
            min-height:72px; padding:7px 5px 5px; border-radius:14px;
            border:2px solid transparent; cursor:pointer;
            transition:all .18s cubic-bezier(.4,0,.2,1);
            display:flex; flex-direction:column; align-items:center;
            background:#f8fafc; position:relative;
        }
        .cal-cell:hover  { border-color:#99f6e4; background:#f0fdf9; transform:translateY(-1px); }
        .cal-cell.cal-active { border-color:var(--primary); background:linear-gradient(135deg,#f0fdf9,#e0f7f4); box-shadow:0 4px 18px rgba(13,148,136,.18); transform:scale(1.04); z-index:2; }
        .cal-num { font-size:.7rem; font-weight:900; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:3px; flex-shrink:0; }
        .cal-num-today    { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow:0 2px 8px rgba(13,148,136,.4); }
        .cal-num-selected { color:var(--primary-d); font-weight:900; }
        .cal-num-normal   { color:#475569; }
        .cal-dots { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; margin-top:auto; }
        .cal-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

        /* Overdue badge on cell */
        .cell-overdue-dot { position:absolute; top:4px; right:4px; width:7px; height:7px; background:#ef4444; border-radius:50%; box-shadow:0 0 0 2px rgba(239,68,68,.25); animation:pulse-r 2s infinite; }

        /* ── HOVER TOOLTIP ── */
        .day-tooltip {
            position:fixed; z-index:200; pointer-events:none;
            background:var(--dark); color:#fff;
            border:1px solid rgba(255,255,255,.12);
            border-radius:16px; padding:14px 16px;
            min-width:220px; max-width:300px;
            box-shadow:var(--sh-pop);
            animation:tooltipIn .15s cubic-bezier(.16,1,.3,1);
        }
        @keyframes tooltipIn { from{opacity:0;transform:scale(.95) translateY(4px)} to{opacity:1;transform:scale(1) translateY(0)} }
        .tt-date { font-size:.58rem; font-weight:800; letter-spacing:.15em; color:rgba(255,255,255,.4); margin-bottom:8px; }
        .tt-row { display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid rgba(255,255,255,.07); }
        .tt-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px; }
        .tt-node { font-size:.65rem; font-weight:700; color:#e2e8f0; line-height:1.4; }
        .tt-status { font-size:.55rem; font-weight:800; letter-spacing:.08em; }
        .tt-delay { font-size:.55rem; font-weight:800; color:#fca5a5; background:rgba(239,68,68,.2); padding:2px 7px; border-radius:999px; margin-top:3px; display:inline-block; }
        .tt-cap { font-size:.58rem; font-weight:700; color:rgba(255,255,255,.4); margin-top:8px; padding-top:7px; border-top:1px solid rgba(255,255,255,.07); }

        /* Status colors in tooltip */
        .tt-pending   { color:#fdba74; }
        .tt-executing { color:#93c5fd; }
        .tt-paused    { color:#fcd34d; }
        .tt-completed { color:#6ee7b7; }
        .tt-cancelled { color:#fca5a5; }
        .tt-overdue   { color:#f87171; }

        /* ── SCHEDULE CARDS ── */
        .sch-card {
            background:var(--surface); border:1px solid var(--border); border-left-width:4px;
            border-radius:20px; padding:18px 20px; transition:all .2s; box-shadow:var(--sh);
        }
        .sch-card:hover { box-shadow:var(--sh-h); transform:translateY(-1px); }
        .s-executing { border-left-color:var(--info); animation:bpulse 2.5s infinite; }
        .s-completed { border-left-color:var(--primary); opacity:.85; }
        .s-paused    { border-left-color:var(--warn); }
        .s-cancelled { border-left-color:var(--danger); opacity:.75; }
        .s-pending   { border-left-color:#f97316; }
        .s-overdue   { border-left-color:#dc2626; }
        @keyframes bpulse { 0%,100%{box-shadow:var(--sh)} 50%{box-shadow:0 0 0 4px rgba(59,130,246,.12),var(--sh)} }

        /* ── BADGES ── */
        .badge { font-size:.57rem; font-weight:800; letter-spacing:.1em; padding:3px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
        .b-pending   { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
        .b-executing { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
        .b-paused    { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
        .b-completed { background:#f0fdf9; color:#065f46; border:1px solid #a7f3d0; }
        .b-cancelled { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .b-overdue   { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .b-delay     { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; font-size:.57rem; font-weight:900; }
        .b-recurring { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
        .b-odt       { background:#faf5ff; color:#6b21a8; border:1px solid #e9d5ff; font-family:'JetBrains Mono',monospace; }

        /* ── ZONE CHIP ── */
        .zone-chip { display:inline-flex; align-items:center; gap:7px; background:#f8fafc; border:1px solid var(--border); padding:4px 10px; border-radius:8px; font-size:.62rem; font-weight:800; letter-spacing:.08em; color:#334155; }
        .zdot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

        /* ── NODE TAGS ── */
        .node-tag { font-family:'JetBrains Mono',monospace; font-size:.62rem; font-weight:600; background:#f8fafc; border:1px solid var(--border); padding:4px 10px; border-radius:7px; color:#334155; }
        .node-box { background:linear-gradient(135deg,#f8fafc,#f0f7ff); border:1px solid var(--border); border-radius:14px; padding:13px; }
        .node-box-lbl { font-size:.56rem; font-weight:800; letter-spacing:.15em; color:var(--primary); margin-bottom:7px; }

        /* ── BUTTONS ── */
        .btn { font-family:'Exo 2',sans-serif; text-transform:uppercase; font-size:.62rem; font-weight:800; letter-spacing:.1em; padding:9px 16px; border-radius:10px; border:none; cursor:pointer; transition:all .18s; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:5px; }
        .btn-start    { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; box-shadow:0 3px 12px rgba(13,148,136,.3); }
        .btn-start:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(13,148,136,.4); }
        .btn-complete { background:linear-gradient(135deg,var(--info),#2563eb); color:#fff; box-shadow:0 3px 12px rgba(59,130,246,.3); }
        .btn-complete:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(59,130,246,.4); }
        .btn-pause  { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
        .btn-pause:hover { background:#fef3c7; }
        .btn-cancel { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .btn-cancel:hover { background:#fee2e2; }
        .btn-reopen { background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; }
        .btn-reopen:hover { background:#e2e8f0; }
        .btn-delete { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; padding:9px; }
        .btn-delete:hover { background:#fee2e2; }
        .btn-edit   { background:#faf5ff; color:#6b21a8; border:1px solid #e9d5ff; }
        .btn-edit:hover { background:#f3e8ff; }
        .btn-resume { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow:0 3px 12px rgba(13,148,136,.3); }
        .btn-dark   { background:linear-gradient(135deg,var(--dark),var(--dark2)); color:#fff; box-shadow:0 4px 16px rgba(13,26,42,.3); }
        .btn-dark:hover { box-shadow:0 6px 20px rgba(13,26,42,.4); transform:translateY(-1px); }
        .btn-full   { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; padding:17px; border-radius:16px; width:100%; font-size:.7rem; letter-spacing:.15em; box-shadow:0 6px 24px rgba(13,148,136,.35); }
        .btn-full:hover { box-shadow:0 10px 36px rgba(13,148,136,.45); transform:translateY(-2px); }

        /* ── FORMS ── */
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-lbl { font-size:.59rem; font-weight:800; letter-spacing:.15em; color:var(--muted); padding-left:3px; }
        .form-inp, .form-sel {
            font-family:'Exo 2',sans-serif; text-transform:uppercase; font-size:.72rem; font-weight:700;
            width:100%; padding:13px 15px; background:#f8fafc; border:2px solid var(--border);
            border-radius:13px; outline:none; color:var(--text); transition:all .18s; appearance:none;
        }
        .form-inp:focus,.form-sel:focus { border-color:var(--primary); background:#fff; box-shadow:0 0 0 4px rgba(13,148,136,.1); }

        /* Custom checkbox */
        .chk { appearance:none; background:#f8fafc; width:20px; height:20px; border:2px solid #cbd5e1; border-radius:6px; display:grid; place-content:center; transition:all .2s; cursor:pointer; flex-shrink:0; }
        .chk::before { content:""; width:.7em; height:.7em; transform:scale(0); transition:120ms transform ease-in-out; box-shadow:inset 1em 1em white; clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%); }
        .chk:checked { background:var(--primary); border-color:var(--primary); }
        .chk:checked::before { transform:scale(1); }
        .chk:disabled { opacity:.4; cursor:not-allowed; }

        /* ── ACTION/EDIT PROMPT ── */
        .prompt-box { background:linear-gradient(135deg,#f8fafc,#f0fdf9); border:1px solid var(--border); border-radius:16px; padding:16px; animation:slideD .2s cubic-bezier(.16,1,.3,1); }
        .prompt-box.edit-mode { background:linear-gradient(135deg,#faf5ff,#f3e8ff); border-color:#e9d5ff; }
        @keyframes slideD { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
        .prompt-lbl { font-size:.58rem; font-weight:800; letter-spacing:.15em; margin-bottom:10px; }
        .prompt-inp { font-family:'Exo 2',sans-serif; text-transform:uppercase; font-size:.72rem; font-weight:700; flex:1; padding:11px 13px; background:#fff; border:2px solid var(--border); border-radius:11px; outline:none; color:var(--text); transition:border-color .18s; }
        .prompt-inp:focus { border-color:var(--primary); }
        .prompt-inp.odt { border-color:#e9d5ff; }
        .prompt-inp.odt:focus { border-color:#a855f7; box-shadow:0 0 0 3px rgba(168,85,247,.1); }

        /* Reason/tech chips */
        .reason-box { font-size:.62rem; font-weight:700; padding:8px 12px; border-radius:10px; }
        .reason-cancelled { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .reason-paused    { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
        .tech-chip { display:inline-flex; align-items:center; gap:6px; background:#f0fdf9; border:1px solid #a7f3d0; padding:5px 12px; border-radius:8px; font-size:.62rem; font-weight:800; color:#065f46; }

        /* ── SECTION TITLE ── */
        .sec-title { font-size:.6rem; font-weight:900; letter-spacing:.2em; color:var(--muted); padding-left:10px; border-left:3px solid var(--primary); }

        /* ── HISTORY TABLE ── */
        .hist-tbl { width:100%; border-collapse:collapse; }
        .hist-tbl th { font-size:.57rem; font-weight:900; letter-spacing:.15em; color:var(--muted); padding:13px 15px; background:#f8fafc; border-bottom:1px solid var(--border); text-align:left; }
        .hist-tbl td { padding:13px 15px; border-bottom:1px solid #f1f5f9; font-size:.7rem; font-weight:700; vertical-align:middle; }
        .hist-tbl tr:last-child td { border-bottom:none; }
        .hist-tbl tr:hover td { background:#f8fafc; }

        /* ── ZONE ADMIN ── */
        .zone-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:17px; box-shadow:var(--sh); transition:all .2s; }
        .zone-card:hover { box-shadow:var(--sh-h); }
        .node-item { display:flex; align-items:center; justify-content:space-between; padding:9px 13px; background:#f8fafc; border-radius:10px; border:1px solid transparent; transition:all .18s; }
        .node-item:hover { background:#f0fdf9; border-color:#a7f3d0; }
        .node-name { font-family:'JetBrains Mono',monospace; font-size:.65rem; font-weight:600; color:#334155; }
        .sub-tab { background:#f1f5f9; padding:4px; border-radius:14px; display:flex; gap:4px; }
        .sub-btn { flex:1; padding:10px; border-radius:10px; border:none; cursor:pointer; font-family:'Exo 2',sans-serif; font-size:.6rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; transition:all .2s; }
        .sub-active   { background:#fff; color:var(--text); box-shadow:0 1px 6px rgba(13,26,42,.1); }
        .sub-inactive { background:transparent; color:var(--muted); }
        .color-sw { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .18s; }
        .color-sw.sel { border-color:var(--dark); box-shadow:0 0 0 3px rgba(13,26,42,.12); transform:scale(1.15); }
        .color-sw:hover:not(.sel) { transform:scale(1.1); }

        /* ── DELETE OVERLAY ── */
        .del-overlay { position:absolute; inset:0; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); z-index:20; border-radius:28px; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn .2s; }
        .del-modal { background:#fff; border:2px solid #fecaca; border-radius:24px; padding:26px; max-width:300px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(220,38,38,.12); }

        /* ── LOADING ── */
        .loading-screen { position:fixed; inset:0; background:var(--dark); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:100; }
        .load-ring { width:60px; height:60px; border:3px solid rgba(13,148,136,.2); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* ── EMPTY STATE ── */
        .empty { padding:40px 20px; text-align:center; }
        .empty-ico { width:46px; height:46px; background:#f1f5f9; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
        .empty-txt { font-size:.63rem; font-weight:800; letter-spacing:.15em; color:var(--muted); }

        /* ── MISC ── */

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const ZONE_COLORS  = ['bg-red-500','bg-blue-500','bg-green-500','bg-yellow-400','bg-purple-500','bg-pink-500','bg-indigo-500','bg-orange-500','bg-teal-500','bg-cyan-500'];

};

// ── Icons ──
const ToolIco   = ({c="h-6 w-6"}) => <svg viewBox="0 0 24 24" fill="none" className={c}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" fill="currentColor"/></svg>;
const ChevL     = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;
