                            <div style={{width:8,height:8,borderRadius:'50%',background:t.color,flexShrink:0,boxShadow:`0 0 0 2px ${t.color}55`}} />
                            <span style={{fontSize:'.55rem',fontWeight:800,letterSpacing:'.1em',color:'var(--muted)'}}>{t.label}</span>
                        </div>
                    ))}
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                        <div style={{width:8,height:8,borderRadius:'50%',background:'#94a3b8',flexShrink:0,boxShadow:'0 0 0 2px #3b82f6'}} />
                        <span style={{fontSize:'.55rem',fontWeight:800,letterSpacing:'.1em',color:'var(--muted)'}}>RELLENO=TIPO · ANILLO=ZONA</span>
                    </div>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════
    // ════════════════════════════════════════════
    // LOADING
    // ════════════════════════════════════════════
    if(loading) return (
        <div className="loading-screen">
            <div style={{position:'relative',marginBottom:8}}>
                <div className="load-ring" />
                <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--primary)'}}>
                    <ToolIco c="h-7 w-7" />
                </div>
            </div>
            <div style={{color:'rgba(255,255,255,.8)',fontSize:'.9rem',fontWeight:900,letterSpacing:'.05em'}}>AIRTEK</div>
            <div style={{color:'rgba(255,255,255,.3)',fontSize:'.6rem',fontWeight:800,letterSpacing:'.2em',animation:'pulse-g 2s infinite'}}>CONECTANDO…</div>
        </div>
    );

    // ════════════════════════════════════════════
    // MAIN RENDER
    // ════════════════════════════════════════════
    return (
        <div style={{minHeight:'100vh',paddingBottom:96}}>
            {/* Tooltip DOM node — populated directly by showTooltip() without React state */}
            <div ref={tooltipRef} className="day-tooltip" style={{display:'none',width:276,position:'fixed',zIndex:9999,pointerEvents:'none'}} />

            {/* ── RESCHEDULE MODAL ── */}
            {reschedule.open && (
                <div style={{position:'fixed',inset:0,background:'rgba(13,27,42,.7)',zIndex:9000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}} onClick={()=>setReschedule({open:false,sch:null,newDate:''})}>
                    <div style={{background:'var(--surface)',borderRadius:16,padding:'24px 22px',width:'100%',maxWidth:380,boxShadow:'0 24px 64px rgba(0,0,0,.25)'}} onClick={e=>e.stopPropagation()}>
                        <div style={{fontSize:'.75rem',fontWeight:900,letterSpacing:'.08em',color:'var(--primary)',marginBottom:4}}>REPROGRAMAR INSPECCIÓN</div>
                        <div style={{fontSize:'.58rem',color:'var(--muted)',fontWeight:700,letterSpacing:'.1em',marginBottom:16}}>
                            NODO: {getNodeName(reschedule.sch?.nodeId||(reschedule.sch?.nodes&&reschedule.sch.nodes[0]))}
                        </div>
                        <div style={{fontSize:'.57rem',fontWeight:800,color:'var(--muted)',letterSpacing:'.1em',marginBottom:6}}>NUEVA FECHA</div>
                        <input
                            type="date"
                            className="prompt-inp"
                            style={{width:'100%',marginBottom:16}}
                            value={reschedule.newDate}
                            onChange={e=>setReschedule(r=>({...r,newDate:e.target.value}))}
                        />
                        {reschedule.sch?.isRecurring && reschedule.sch?.groupId && (
                            <div style={{fontSize:'.57rem',fontWeight:700,color:'#0e7490',background:'rgba(6,182,212,.1)',border:'1px solid rgba(6,182,212,.3)',borderRadius:8,padding:'8px 12px',marginBottom:16,letterSpacing:'.06em'}}>
                                ℹ️ ACTIVIDAD RECURRENTE · LA PRÓXIMA OCURRENCIA SE CALCULARÁ DESDE LA NUEVA FECHA AL COMPLETARLA.
                            </div>
                        )}
                        <div style={{display:'flex',gap:8}}>
                            <button onClick={()=>setReschedule({open:false,sch:null,newDate:''})} className="btn btn-reopen" style={{flex:1}}>CANCELAR</button>
                            <button onClick={handleReschedule} className="btn btn-start" style={{flex:2}}>CONFIRMAR NUEVA FECHA</button>
                        </div>
                    </div>
                </div>
            )}

            {/* ── HEADER ── */}
            <header className="app-header" style={{padding:'14px 20px'}}>
                <div style={{maxWidth:740,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <div className="logo-ring"><ToolIco c="h-6 w-6" /></div>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <span className="header-title">Airtek</span>
                                <span className="header-badge">PREVENTIVO</span>
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3}}>
                                <span className={`status-dot ${isCloud?'online':'offline'}`} />
                                <span className={`status-lbl ${isCloud?'online-lbl':'offline-lbl'}`}>{isCloud?'SISTEMA ONLINE':'OFFLINE'}</span>
                            </div>
                        </div>
                    </div>
                    <button onClick={()=>setIsAdmin(!isAdmin)} className={`mode-btn ${isAdmin?'mode-active':'mode-inactive'}`}>
                        {isAdmin ? '✎ EDITOR' : '◉ LECTURA'}
                    </button>
                </div>
            </header>

            <div style={{maxWidth:740,margin:'0 auto',padding:'18px 14px',display:'flex',flexDirection:'column',gap:16}}>

                {/* ── STATS BAR ── */}
                <div className="stats-bar">
                    {[
                        {cls:'stat-pending',   num:stats.pending,   lbl:'PENDIENTES'},
                        {cls:'stat-executing', num:stats.executing, lbl:'EN EJECUCIÓN'},
                        {cls:'stat-overdue',   num:stats.overdue,   lbl:'VENCIDAS'},
                        {cls:'stat-done',      num:stats.done,      lbl:'COMPLETADAS'},
                    ].map(s=>(
                        <div key={s.lbl} className={`stat-card ${s.cls}`}>
                            <div className="stat-num">{s.num}</div>
                            <div className="stat-lbl">{s.lbl}</div>
                        </div>
                    ))}
                </div>

                {/* ── TABS ── */}
                <nav className="tab-nav no-scroll">
                    {[
                        {id:'cronograma',label:'CALENDARIO'},
                        {id:'programar', label:'PROGRAMAR'},
                        {id:'historial', label:'HISTORIAL'},
                        {id:'maestro',   label:'ZONAS / NODOS'}
                    ].map(t=>(
                        <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`tab-btn ${activeTab===t.id?'tab-active':'tab-inactive'}`}>{t.label}</button>
                    ))}
                </nav>

                {/* ── CONTENT ── */}
                <main className="tab-content" style={{display:'flex',flexDirection:'column',gap:14}}>

                    {/* ────── CALENDARIO ────── */}
                    {activeTab==='cronograma' && (
                        <>
                            {/* Filter + Today bar */}
                            <div className="filter-bar">
                                <span className="filter-lbl">FILTRAR:</span>
                                <select className="filter-select" value={filterZone} onChange={e=>setFilterZone(e.target.value)}>
                                    <option value="">TODAS LAS ZONAS</option>
                                    {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                </select>
                                <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
                                    <option value="">TODOS LOS ESTADOS</option>
                                    <option value="PENDIENTE">PENDIENTE</option>
                                    <option value="EN EJECUCION">EN EJECUCIÓN</option>
                                    <option value="EN PAUSA">EN PAUSA</option>
                                    <option value="COMPLETADO">COMPLETADO</option>
                                    <option value="ANULADA">ANULADA</option>
                                </select>
                                <select className="filter-select" value={filterCoord} onChange={e=>setFilterCoord(e.target.value)}>
                                    <option value="">TODAS LAS COORDINACIONES</option>
                                    {COORDINACIONES.map(c=><option key={c} value={c}>{c}</option>)}
                                </select>
                                {(filterZone||filterStatus||filterCoord) && (
                                    <button className="filter-clear" onClick={()=>{setFilterZone('');setFilterStatus('');setFilterCoord('');}}>✕ LIMPIAR</button>
                                )}
                                <button className="today-btn" onClick={goToday} style={{marginLeft:'auto'}}>⊙ HOY</button>
                            </div>

                            <Calendar />

                            {/* Upcoming expiry warning banner */}
                            {upcomingWarnings.length > 0 && (
                                <div style={{background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.35)',borderRadius:12,padding:'12px 16px',display:'flex',flexDirection:'column',gap:8}}>
                                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                                            <span style={{fontSize:'1rem'}}>⚠️</span>
                                            <span style={{fontSize:'.65rem',fontWeight:900,color:'#92400e',letterSpacing:'.08em'}}>
                                                {upcomingWarnings.length} INSPECCIÓN{upcomingWarnings.length>1?'ES':''} POR VENCER EN {warnDays} DÍA{warnDays>1?'S':''}
                                            </span>
                                        </div>
                                        <button onClick={()=>setShowWarnCfg(v=>!v)} style={{fontSize:'.52rem',fontWeight:800,color:'#92400e',background:'rgba(245,158,11,.2)',border:'1px solid rgba(245,158,11,.3)',borderRadius:6,padding:'3px 8px',cursor:'pointer',letterSpacing:'.08em',whiteSpace:'nowrap'}}>
                                            ⚙ {showWarnCfg?'CERRAR':'CONFIGURAR'}
                                        </button>
                                    </div>
                                    {showWarnCfg && (
                                        <div style={{display:'flex',alignItems:'center',gap:8,paddingTop:8,borderTop:'1px solid rgba(245,158,11,.2)'}}>
                                            <span style={{fontSize:'.57rem',fontWeight:800,color:'#92400e',letterSpacing:'.08em',whiteSpace:'nowrap'}}>AVISAR CON</span>
                                            <input type="number" min="1" max="30" value={warnDays}
                                                onChange={e=>setWarnDays(Math.max(1,Math.min(30,+e.target.value)))}
                                                style={{width:56,padding:'4px 8px',borderRadius:6,border:'1px solid rgba(245,158,11,.4)',background:'rgba(255,255,255,.7)',fontFamily:"'Exo 2',sans-serif",fontWeight:800,fontSize:'.7rem',textAlign:'center'}} />
                                            <span style={{fontSize:'.57rem',fontWeight:800,color:'#92400e',letterSpacing:'.08em'}}>DÍAS DE ANTICIPACIÓN</span>
                                        </div>
                                    )}
                                    <div style={{display:'flex',flexDirection:'column',gap:4}}>
                                        {upcomingWarnings.map(s=>{
                                            const nid = s.nodeId||(s.nodes&&s.nodes[0]);
                                            const isZone = s.scope === 'zone';
                                            const label = isZone
                                                ? `🗂 ${getZoneName(s.zoneId)}`
                                                : getNodeName(nid);
                                            const subLabel = isZone
                                                ? nodes.filter(n=>n.zoneId===s.zoneId).map(n=>n.name).join(' · ')
                                                : null;
                                            const daysLeft = Math.ceil((new Date(s.date+'T00:00:00Z') - new Date(TODAY_STR+'T00:00:00Z')) / 86400000);
                                            return (
                                                <div key={s.id} style={{display:'flex',alignItems:'center',gap:8,background:'rgba(255,255,255,.5)',borderRadius:8,padding:'6px 10px',cursor:'pointer'}}
                                                    onClick={()=>{ setSelDate(s.date); setCurMonth(new Date(s.date.slice(0,7)+'-01T00:00:00Z')); }}>
                                                    <div style={{flex:1,minWidth:0}}>
                                                        <div style={{fontSize:'.56rem',fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:'#78350f',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                                                            {label}
                                                        </div>
                                                        {subLabel && (
                                                            <div style={{fontSize:'.52rem',fontWeight:600,color:'#92400e',opacity:.7,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',marginTop:1}}>
                                                                {subLabel}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <span style={{fontSize:'.55rem',fontWeight:800,color:'var(--muted)',whiteSpace:'nowrap'}}>{formatDate(s.date).split(',')[0]}</span>
                                                    <span style={{fontSize:'.54rem',fontWeight:900,color:daysLeft===0?'#dc2626':'#b45309',background:daysLeft===0?'rgba(220,38,38,.15)':'rgba(180,83,9,.15)',padding:'2px 7px',borderRadius:999,whiteSpace:'nowrap'}}>
                                                        {daysLeft===0?'HOY':daysLeft===1?'MAÑANA':`${daysLeft}D`}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* Day detail */}
                            <div>
                                <div className="sec-title" style={{marginBottom:12}}>
                                    {selDate ? formatDate(selDate) : 'SELECCIONE UN DÍA'}
                                </div>
                                {daySchedules.length===0 ? (
                                    <div className="card">
                                        <div className="empty">
                                            <div className="empty-ico">
                                                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                                            </div>
                                            <div className="empty-txt">
                                                {filterZone||filterStatus ? 'SIN RESULTADOS CON ESTOS FILTROS' : 'DÍA LIBRE · SIN MANTENIMIENTOS'}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                                        {/* Day summary */}
                                        <div style={{display:'flex',gap:8,flexWrap:'wrap',paddingLeft:2}}>
                                            <span style={{fontSize:'.6rem',fontWeight:800,letterSpacing:'.1em',color:'var(--muted)'}}>
                                                {daySchedules.length} ACTIVIDAD{daySchedules.length!==1?'ES':''} AGENDADA{daySchedules.length!==1?'S':''}
                                            </span>
                                        </div>
                                        {daySchedules.map(sch=>(
                                            <SchCard key={sch.id} sch={sch} helpers={{
                                                getZoneName, getZoneColor, getNodeName,
                                                activeAction, activeEdit,
                                                onStart: handleCardStart,
                                                onPauseCancel: handleCardPauseCancel,
                                                onEdit: handleCardEdit,
                                                onCancelAction: ()=>setActiveAction(null),
                                                onCancelEdit:   ()=>setActiveEdit(null),
                                                onStatusChange: handleStatusChange,
                                                onDelete: promptDelete,
                                                onReschedule: (s)=>setReschedule({open:true,sch:s,newDate:''}),
                                                isAdmin,
                                            }} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {/* ────── PROGRAMAR ────── */}
                    {activeTab==='programar' && (
                        <form onSubmit={handleSaveSchedule} className="card card-xl" style={{padding:'26px',display:'flex',flexDirection:'column',gap:16}}>
                            <div style={{textAlign:'center',paddingBottom:14,borderBottom:'1px solid var(--border)'}}>
                                <div style={{fontSize:'.75rem',fontWeight:900,color:'var(--primary)',letterSpacing:'.08em',marginBottom:12}}>PROGRAMAR ACTIVIDAD</div>
                                {/* Mode toggle */}
                                <div style={{display:'flex',background:'#f1f5f9',borderRadius:12,padding:4,gap:4}}>
                                    {[{id:'node',label:'📍 POR NODO'},{id:'zone',label:'🗂 POR ZONA COMPLETA'}].map(m=>(
                                        <button key={m.id} type="button"
                                            onClick={()=>setNewSch({...newSch,scheduleMode:m.id,selectedNodes:[]})}
                                            style={{flex:1,padding:'9px 6px',borderRadius:9,border:'none',cursor:'pointer',fontFamily:"'Exo 2',sans-serif",fontSize:'.6rem',fontWeight:900,letterSpacing:'.08em',textTransform:'uppercase',transition:'all .2s',
                                                background:newSch.scheduleMode===m.id?'#fff':'transparent',
                                                color:newSch.scheduleMode===m.id?'var(--primary)':'var(--muted)',
                                                boxShadow:newSch.scheduleMode===m.id?'0 1px 6px rgba(13,26,42,.1)':'none'
                                            }}>
                                            {m.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Nombre de la actividad */}
                            <div className="form-group">
                                <label className="form-lbl">NOMBRE DE LA ACTIVIDAD</label>
                                <input required className="form-inp" placeholder="EJ: INSPECCIÓN PM, MANTENIMIENTO PLANTA, PROYECTO FIBRA..."
                                    value={newSch.activityName}
                                    onChange={e=>setNewSch({...newSch,activityName:e.target.value.toUpperCase()})} />
                            </div>

                            {/* Tipo de actividad */}
                            <div className="form-group">
                                <label className="form-lbl">TIPO DE ACTIVIDAD</label>
                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                                    {ACTIVITY_TYPES.map(t=>(
                                        <button key={t.id} type="button"
                                            onClick={()=>setNewSch({...newSch,activityType:t.id})}
                                            style={{padding:'10px 8px',borderRadius:10,border:`2px solid ${newSch.activityType===t.id?t.color:t.border}`,cursor:'pointer',fontFamily:"'Exo 2',sans-serif",fontSize:'.6rem',fontWeight:900,letterSpacing:'.08em',textTransform:'uppercase',transition:'all .2s',
                                                background:newSch.activityType===t.id?t.bg:'transparent',
                                                color:newSch.activityType===t.id?t.color:'var(--muted)',
                                                display:'flex',alignItems:'center',gap:6
                                            }}>
                                            <span style={{width:8,height:8,borderRadius:'50%',background:t.color,flexShrink:0}} />{t.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Coordinación */}
                            <div className="form-group">
                                <label className="form-lbl">COORDINACIÓN</label>
                                <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                                    {COORDINACIONES.map(c=>(
                                        <button key={c} type="button"
                                            onClick={()=>setNewSch({...newSch,coordinacion:c})}
                                            style={{padding:'8px 14px',borderRadius:999,border:`1.5px solid ${newSch.coordinacion===c?'var(--primary)':'var(--border)'}`,cursor:'pointer',fontFamily:"'Exo 2',sans-serif",fontSize:'.6rem',fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',transition:'all .2s',
                                                background:newSch.coordinacion===c?'var(--primary-l)':'transparent',
                                                color:newSch.coordinacion===c?'var(--primary-d)':'var(--muted)'
                                            }}>
                                            {c}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                                <div className="form-group">
                                    <label className="form-lbl">FECHA BASE</label>
                                    <input required type="date" className="form-inp" value={newSch.date} onChange={e=>setNewSch({...newSch,date:e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label className="form-lbl">ZONA</label>
                                    <select required className="form-sel" value={newSch.zoneId} onChange={e=>setNewSch({...newSch,zoneId:e.target.value,selectedNodes:[]})}>
                                        <option value="">ELEGIR ZONA…</option>
                                        {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            {newSch.zoneId && newSch.scheduleMode === 'node' && (
                                <div className="node-sel-box">
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                                        <label style={{fontSize:'.6rem',fontWeight:900,letterSpacing:'.12em',color:'var(--primary)'}}>NODOS A INTERVENIR</label>
                                        <span style={{fontSize:'.6rem',fontWeight:800,padding:'3px 10px',borderRadius:999,background:'#f1f5f9',color:'#475569',border:'1px solid #e2e8f0'}}>
                                            {newSch.selectedNodes.length} SELECCIONADO{newSch.selectedNodes.length!==1?'S':''}
                                        </span>
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
                                        {nodesInZone.map(n=>{
                                            const isSel = newSch.selectedNodes.includes(n.id);
                                            return (
                                                <label key={n.id} className={`node-sel-lbl ${isSel?'nsl-sel':''}`}>
                                                    <input type="checkbox" className="chk" checked={isSel} onChange={()=>toggleNode(n.id)} />
                                                    <span style={{fontSize:'.68rem',fontWeight:800,color:isSel?'var(--primary-d)':'#334155'}}>{n.name}</span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                            {newSch.zoneId && newSch.scheduleMode === 'zone' && (
                                <div style={{background:'rgba(13,148,136,.07)',border:'1px solid rgba(13,148,136,.2)',borderRadius:16,padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
                                    <span style={{fontSize:'1.4rem'}}>🗂</span>
                                    <div>
                                        <div style={{fontSize:'.65rem',fontWeight:900,color:'var(--primary)',letterSpacing:'.08em'}}>SE CREARÁ UN EVENTO DE ZONA</div>
                                        <div style={{fontSize:'.58rem',color:'var(--muted)',marginTop:3,letterSpacing:'.06em'}}>
                                            {zones.find(z=>z.id===newSch.zoneId)?.name} · {nodes.filter(n=>n.zoneId===newSch.zoneId).length} NODOS
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="recur-box">
                                <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                                    <input type="checkbox" className="chk" checked={newSch.recurring} onChange={e=>setNewSch({...newSch,recurring:e.target.checked})} />
                                    <span style={{fontSize:'.68rem',fontWeight:800,color:'#0f766e',letterSpacing:'.08em'}}>ACTIVIDAD RECURRENTE</span>
                                </label>
                                {newSch.recurring && (
                                    <div className="form-group" style={{marginTop:12}}>
                                        <label className="form-lbl" style={{color:'#0f766e'}}>REPETIR CADA (DÍAS)</label>
                                        <input type="number" className="form-inp" style={{background:'#fff',borderColor:'#a7f3d0'}} value={newSch.repeatDays} min="1" onChange={e=>setNewSch({...newSch,repeatDays:e.target.value})} />
                                        <span style={{fontSize:'.58rem',fontWeight:700,color:'#0f766e',fontStyle:'italic',marginTop:4}}>AL COMPLETAR CADA OCURRENCIA SE GENERA AUTOMÁTICAMENTE LA SIGUIENTE.</span>
                                    </div>
                                )}
                            </div>

                            <div style={{fontSize:'.58rem',fontWeight:700,color:'var(--muted)',textAlign:'center',fontStyle:'italic'}}>
                                * TÉCNICOS Y ODT SE ASIGNAN AL INICIAR CADA TAREA EN EL CALENDARIO.
                            </div>

                            <button type="submit" className="btn btn-full">AGENDAR ACTIVIDAD</button>
                        </form>
                    )}

                    {/* ────── HISTORIAL ────── */}
                    {activeTab==='historial' && (() => {
                        const completed = schedules.filter(s=>s.status==='COMPLETADO');
                        const filtered  = completed.filter(s => {
                            const nid = s.nodeId || (s.nodes&&s.nodes[0]);
                            if(histFilterZone && s.zoneId !== histFilterZone) return false;
                            if(histFilterNode && nid !== histFilterNode) return false;
                            if(histFilterTech && !(s.techs||'').toUpperCase().includes(histFilterTech.toUpperCase())) return false;
                            if(histFilterDateFrom && s.date < histFilterDateFrom) return false;
                            if(histFilterDateTo   && s.date > histFilterDateTo)   return false;
                            if(histFilterCoord && (s.coordinacion||'OPERACIONES') !== histFilterCoord) return false;
                            if(histFilterType  && (s.activityType||'planificada') !== histFilterType)  return false;
                            return true;
                        }).sort((a,b)=>new Date(b.date)-new Date(a.date));

                        const clearAll = () => { setHistFilterZone(''); setHistFilterNode(''); setHistFilterTech(''); setHistFilterDateFrom(''); setHistFilterDateTo(''); setHistFilterCoord(''); setHistFilterType(''); };
                        const hasFilter = histFilterZone||histFilterNode||histFilterTech||histFilterDateFrom||histFilterDateTo||histFilterCoord||histFilterType;

                        return (
                        <>
                            {/* Header */}
                            <div className="card" style={{padding:'18px 22px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                                <div>
                                    <div style={{fontSize:'.75rem',fontWeight:900,letterSpacing:'.06em'}}>HISTORIAL DE EJECUCIÓN</div>
                                    <div style={{fontSize:'.6rem',fontWeight:700,color:'var(--muted)',marginTop:3,letterSpacing:'.1em'}}>
                                        {filtered.length} DE {completed.length} ACTIVIDADES
                                    </div>
                                </div>
                                <div style={{display:'flex',gap:7}}>
                                    <button onClick={()=>exportPDF(filtered)} className="btn btn-dark" style={{gap:6}}><PdfIco /> PDF</button>
                                    <button onClick={()=>exportExcel(filtered)} className="btn btn-dark" style={{gap:6,background:'rgba(34,197,94,.12)',color:'#15803d',border:'1px solid rgba(34,197,94,.3)'}}>
                                        <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                                        EXCEL
                                    </button>
                                </div>
                            </div>

                            {/* Filters row 1 — Zone / Node / Tech */}
                            <div className="filter-bar" style={{flexWrap:'wrap',gap:8}}>
                                <span className="filter-lbl">FILTRAR:</span>
                                <select className="filter-select" value={histFilterZone} onChange={e=>{setHistFilterZone(e.target.value);setHistFilterNode('');}}>
                                    <option value="">TODAS LAS ZONAS</option>
                                    {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                </select>
                                <select className="filter-select" value={histFilterNode} onChange={e=>setHistFilterNode(e.target.value)}>
                                    <option value="">TODOS LOS NODOS</option>
                                    {(histFilterZone ? nodes.filter(n=>n.zoneId===histFilterZone) : nodes)
                                        .map(n=><option key={n.id} value={n.id}>{n.name}</option>)}
                                </select>
                                <input className="filter-select" style={{minWidth:130}} placeholder="TÉCNICO..."
                                    value={histFilterTech} onChange={e=>setHistFilterTech(e.target.value)} />
                            </div>

                            {/* Filters row 2 — Coordinacion / Type */}
                            <div className="filter-bar" style={{flexWrap:'wrap',gap:8}}>
                                <span className="filter-lbl">TIPO:</span>
                                <select className="filter-select" value={histFilterCoord} onChange={e=>setHistFilterCoord(e.target.value)}>
                                    <option value="">TODAS LAS COORDINACIONES</option>
                                    {COORDINACIONES.map(c=><option key={c} value={c}>{c}</option>)}
                                </select>
                                <select className="filter-select" value={histFilterType} onChange={e=>setHistFilterType(e.target.value)}>
                                    <option value="">TODOS LOS TIPOS</option>
                                    {ACTIVITY_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
                                </select>
                            </div>

                            {/* Filters row 3 — Date range */}
                            <div className="filter-bar" style={{flexWrap:'wrap',gap:8,alignItems:'center'}}>
                                <span className="filter-lbl">RANGO:</span>
                                <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    <span style={{fontSize:'.58rem',fontWeight:800,color:'var(--muted)',letterSpacing:'.08em',whiteSpace:'nowrap'}}>DESDE</span>
                                    <input type="date" className="filter-select"
                                        style={{width:'auto',cursor:'pointer'}}
                                        value={histFilterDateFrom}
                                        onChange={e=>setHistFilterDateFrom(e.target.value)} />
                                </div>
                                <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    <span style={{fontSize:'.58rem',fontWeight:800,color:'var(--muted)',letterSpacing:'.08em',whiteSpace:'nowrap'}}>HASTA</span>
                                    <input type="date" className="filter-select"
                                        style={{width:'auto',cursor:'pointer'}}
                                        value={histFilterDateTo}
                                        onChange={e=>setHistFilterDateTo(e.target.value)} />
                                </div>
                                {(histFilterDateFrom || histFilterDateTo) && (
                                    <button className="filter-clear" style={{background:'rgba(13,148,136,.1)',color:'var(--primary)',border:'1px solid rgba(13,148,136,.25)'}}
                                        onClick={()=>{setHistFilterDateFrom('');setHistFilterDateTo('');}}>
                                        ✕ LIMPIAR RANGO
                                    </button>
                                )}
                                {hasFilter && (
                                    <button className="filter-clear" onClick={clearAll}>✕ LIMPIAR TODO</button>
                                )}
                            </div>

                            {/* Table */}
                            <div className="card" style={{overflow:'hidden'}}>
                                <div style={{overflowX:'auto'}}>
                                    <table className="hist-tbl">
                                        <thead>
                                            <tr>
                                                <th>FECHA</th>
                                                <th>ACTIVIDAD</th>
                                                <th>TIPO</th>
                                                <th>COORDINACIÓN</th>
                                                <th>ZONA / NODO</th>
                                                <th>ODT</th>
                                                <th>TÉCNICOS</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filtered.length===0 ? (
                                                <tr><td colSpan="7" style={{textAlign:'center',padding:40,color:'var(--muted)',fontSize:'.63rem',fontWeight:800,letterSpacing:'.12em'}}>
                                                    {completed.length===0 ? 'AÚN NO HAY ACTIVIDADES FINALIZADAS' : 'SIN RESULTADOS CON ESTOS FILTROS'}
                                                </td></tr>
                                            ) : (
                                                filtered.map(s => {
                                                    const nid = s.nodeId || (s.nodes&&s.nodes[0]);
                                                    const isZone = s.scope === 'zone';
                                                    const nodeLabel = isZone
                                                        ? `🗂 ${getZoneName(s.zoneId)}`
                                                        : getNodeName(nid);
                                                    const nodeSubLabel = isZone
                                                        ? nodes.filter(n=>n.zoneId===s.zoneId).map(n=>n.name).join(', ')
                                                        : null;
                                                    const actT = getActType(s.activityType||'planificada');
                                                    return (
                                                    <tr key={s.id}>
                                                        <td style={{whiteSpace:'nowrap',fontFamily:"'JetBrains Mono',monospace",fontSize:'.62rem'}}>{formatDate(s.date)}</td>
                                                        <td style={{fontWeight:800,fontSize:'.65rem'}}>{s.activityName||'INSPECCIÓN PM'}</td>
                                                        <td>
                                                            <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'.55rem',fontWeight:800,padding:'2px 7px',borderRadius:999,background:actT.bg,color:actT.color,border:`1px solid ${actT.border}`,whiteSpace:'nowrap'}}>
                                                                <span style={{width:5,height:5,borderRadius:'50%',background:actT.color,flexShrink:0}} />{actT.label}
                                                            </span>
                                                        </td>
                                                        <td style={{fontSize:'.62rem',fontWeight:700,color:'var(--muted)'}}>{s.coordinacion||'OPERACIONES'}</td>
                                                        <td>
                                                            <div className="zone-chip"><span className={`zdot ${getZoneColor(s.zoneId)}`} />{getZoneName(s.zoneId)}</div>
                                                            <span className="node-tag" style={{marginTop:3,display:'inline-block'}}>{nodeLabel}</span>
                                                            {nodeSubLabel && <div style={{fontSize:'.55rem',color:'var(--muted)',marginTop:3}}>{nodeSubLabel}</div>}
                                                        </td>
                                                        <td>{s.odt ? <span className="badge b-odt">{s.odt}</span> : <span style={{color:'var(--muted)'}}>—</span>}</td>
                                                        <td style={{color:'var(--primary)',fontWeight:800}}>{s.techs||'NO REGISTRADO'}</td>
                                                    </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                        );
                    })()}


                    {/* ────── MAESTRO ────── */}
                    {activeTab==='maestro' && (
                        <>
                            <div className="sub-tab">
                                {['zona','nodo'].map(t=>(
                                    <button key={t} onClick={()=>setAdminSec(t)} className={`sub-btn ${adminSec===t?'sub-active':'sub-inactive'}`}>
                                        {t==='zona'?'ADMINISTRAR ZONAS':'ADMINISTRAR NODOS'}
                                    </button>
                                ))}
                            </div>

                            {adminSec==='zona' && (
                                <>
                                    <form onSubmit={handleAddZone} className="card card-xl" style={{padding:'22px',display:'flex',flexDirection:'column',gap:12}}>
                                        <div style={{fontSize:'.65rem',fontWeight:900,textAlign:'center',letterSpacing:'.08em',borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:2}}>NUEVA ZONA GEOGRÁFICA</div>
                                        <div className="form-group">
                                            <label className="form-lbl">NOMBRE</label>
                                            <input required className="form-inp" placeholder="EJ: SAN FRANCISCO" value={newZone.name} onChange={e=>setNewZone({...newZone,name:e.target.value.toUpperCase()})} />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-lbl">COLOR EN CALENDARIO</label>
                                            <div style={{display:'flex',flexWrap:'wrap',gap:8,paddingTop:4}}>
                                                {ZONE_COLORS.map(c=>(
                                                    <button key={c} type="button" onClick={()=>setNewZone({...newZone,color:c})} className={`color-sw ${c} ${newZone.color===c?'sel':''}`} />
                                                ))}
                                            </div>
                                        </div>
                                        <button type="submit" className="btn btn-dark" style={{width:'100%',padding:'13px',borderRadius:14,marginTop:4}}>+ CREAR ZONA</button>
                                    </form>
                                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                                        <div className="sec-title" style={{marginBottom:4,display:'flex',justifyContent:'space-between'}}>
                                            <span>ZONAS REGISTRADAS ({zones.length})</span>
                                            {isAdmin && <span style={{color:'var(--primary)',fontSize:'.58rem'}}>MODO EDITOR ACTIVO</span>}
                                        </div>
                                        {zones.map(z=>(
                                            <div key={z.id} className="zone-card">
                                                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                                                        <span className={`${z.color||'bg-slate-500'}`} style={{width:14,height:14,borderRadius:'50%',display:'inline-block',flexShrink:0}} />
                                                        <span style={{fontSize:'.75rem',fontWeight:900}}>{z.name}</span>
                                                        <span style={{fontSize:'.58rem',color:'var(--muted)',fontWeight:700}}>{nodes.filter(n=>n.zoneId===z.id).length} NODOS</span>
                                                    </div>
                                                    {isAdmin && <button onClick={()=>deleteItem('pm_zones',z.id,z.name)} className="btn btn-delete"><TrashIco /></button>}
                                                </div>
                                                {isAdmin && (
                                                    <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)',display:'flex',flexWrap:'wrap',gap:6}}>
                                                        {ZONE_COLORS.map(c=>(
                                                            <button key={c} type="button" onClick={()=>handleUpdateZoneColor(z.id,c)} className={`color-sw ${c}`} style={{width:22,height:22,opacity:z.color===c?1:.3}} />
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}

                            {adminSec==='nodo' && (
                                <>
                                    <form onSubmit={handleAddNode} className="card card-xl" style={{padding:'22px',display:'flex',flexDirection:'column',gap:12}}>
                                        <div style={{fontSize:'.65rem',fontWeight:900,textAlign:'center',letterSpacing:'.08em',borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:2}}>AGREGAR NODO A UNA ZONA</div>
                                        <div className="form-group">
                                            <label className="form-lbl">ZONA DESTINO</label>
                                            <select required className="form-sel" value={newNode.zoneId} onChange={e=>setNewNode({...newNode,zoneId:e.target.value})}>
                                                <option value="">SELECCIONAR ZONA…</option>
                                                {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                            </select>
                                        </div>
                                        <div style={{display:'flex',gap:8}}>
                                            <div className="form-group" style={{flex:1}}>
                                                <label className="form-lbl">NOMBRE DEL NODO</label>
                                                <input required className="form-inp" placeholder="NOMBRE DEL NODO" value={newNode.name} onChange={e=>setNewNode({...newNode,name:e.target.value.toUpperCase()})} />
                                            </div>
                                            <div style={{alignSelf:'flex-end'}}>
                                                <button type="submit" className="btn btn-dark" style={{padding:'13px 20px',borderRadius:13}}>+ CREAR</button>
                                            </div>
                                        </div>
                                    </form>
                                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                                        <div className="sec-title" style={{marginBottom:4}}>NODOS POR ZONA</div>
                                        {zones.map(z=>{
                                            const znodes=nodes.filter(n=>n.zoneId===z.id);
                                            if(!znodes.length) return null;
                                            return (
                                                <div key={z.id} className="zone-card">
                                                    <div style={{display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid var(--border)',paddingBottom:10,marginBottom:10}}>
                                                        <span className={`${z.color||'bg-slate-500'}`} style={{width:8,height:8,borderRadius:'50%',display:'inline-block',flexShrink:0}} />
                                                        <span style={{fontSize:'.63rem',fontWeight:900,letterSpacing:'.12em'}}>{z.name}</span>
                                                        <span style={{fontSize:'.58rem',fontWeight:700,color:'var(--muted)',marginLeft:'auto'}}>{znodes.length} NODO{znodes.length!==1?'S':''}</span>
                                                    </div>
                                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                                                        {znodes.map(n=>(
                                                            <div key={n.id} className="node-item">
                                                                <span className="node-name">{n.name}</span>
                                                                {isAdmin && <button onClick={()=>deleteItem('pm_nodes',n.id,n.name)} style={{color:'#dc2626',background:'none',border:'none',cursor:'pointer',padding:4,lineHeight:0}}><TrashIco /></button>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}
                        </>
                    )}
                </main>
            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
