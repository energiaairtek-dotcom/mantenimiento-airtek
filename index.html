
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airtek - Mantenimiento Preventivo Zulia</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }
        
        .shadow-premium {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .tab-content {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .pulse-executing {
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        input, select, textarea {
            text-transform: uppercase !important;
        }

        /* Tooltip Styles */
        .group:hover .tooltip-content {
            display: block;
        }
        
        .custom-checkbox {
            appearance: none;
            background-color: #f8fafc;
            width: 1.5em; height: 1.5em;
            border: 2px solid #cbd5e1;
            border-radius: 0.35em;
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        .custom-checkbox:checked { background-color: #0d9488; border-color: #0d9488; }
        .custom-checkbox:checked::before {
            content: ""; width: 0.6em; height: 0.6em;
            box-shadow: inset 1em 1em white;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, collection, query, onSnapshot, addDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myConfig = {
            apiKey: "AIzaSyDwaK4Z26RfqDwNvwdMqri08oEjwG9qymc",
            authDomain: "almacen-airtek.firebaseapp.com",
            projectId: "almacen-airtek",
            storageBucket: "almacen-airtek.firebasestorage.app",
            messagingSenderId: "934058211778",
            appId: "1:934058211778:web:6cc9d820c41fa90aa5fe5b"
        };

        window.FirebaseSDK = {
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken,
            getFirestore, doc, setDoc, updateDoc, deleteDoc, collection, 
            query, onSnapshot, addDoc, serverTimestamp, writeBatch
        };
        window.__firebase_config_manual = JSON.stringify(myConfig);
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const ZONE_COLORS = ['bg-red-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-400', 'bg-purple-500', 'bg-orange-500', 'bg-teal-500'];
        const MONTH_NAMES = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

        const MaintenanceLogo = ({ className = "h-8 w-8" }) => (
            <svg viewBox="0 0 24 24" fill="none" className={className} xmlns="http://www.w3.org/2000/svg">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" fill="currentColor"/>
            </svg>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('cronograma');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [zones, setZones] = useState([]);
            const [nodes, setNodes] = useState([]);
            const [schedules, setSchedules] = useState([]);
            
            const [newZone, setNewZone] = useState({ name: '', color: ZONE_COLORS[0] });
            const [newNode, setNewNode] = useState({ name: '', zoneId: '' });
            const [newSchedule, setNewSchedule] = useState({ date: '', zoneId: '', selectedNodes: [], recurring: false, repeatDays: 30 });
            
            const [actionPrompt, setActionPrompt] = useState({ id: null, type: null, text: '', odt: '' });
            const [editMode, setEditMode] = useState({ id: null, field: null }); // Para editar Técnicos u ODT

            const [historyFilterZone, setHistoryFilterZone] = useState('');
            const [historyFilterNode, setHistoryFilterNode] = useState('');
            const [historyFilterTech, setHistoryFilterTech] = useState('');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [selectedDateDetails, setSelectedDateDetails] = useState(new Date().toISOString().split('T')[0]);

            const dbRef = useRef(null);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-pm-app-id';

            useEffect(() => {
                const init = async () => {
                    const { initializeApp, getAuth, getFirestore, signInAnonymously, onAuthStateChanged } = window.FirebaseSDK;
                    const config = JSON.parse(window.__firebase_config_manual);
                    const app = initializeApp(config);
                    dbRef.current = getFirestore(app);
                    const auth = getAuth(app);
                    await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); });
                };
                init();
            }, []);

            useEffect(() => {
                if (!user || !dbRef.current) return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                const unsubZones = onSnapshot(collection(dbRef.current, 'artifacts', appId, 'public', 'data', 'pm_zones'), snap => setZones(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                const unsubNodes = onSnapshot(collection(dbRef.current, 'artifacts', appId, 'public', 'data', 'pm_nodes'), snap => setNodes(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                const unsubSchedules = onSnapshot(collection(dbRef.current, 'artifacts', appId, 'public', 'data', 'pm_schedules'), snap => setSchedules(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                return () => { unsubZones(); unsubNodes(); unsubSchedules(); };
            }, [user]);

            const getZoneName = (id) => zones.find(z => z.id === id)?.name || 'S/Z';
            const getZoneColor = (id) => zones.find(z => z.id === id)?.color || 'bg-slate-500';
            const getNodeName = (id) => nodes.find(n => n.id === id)?.name || 'ELIMINADO';

            const calculateDelay = (dateStr) => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const schDate = new Date(dateStr + 'T00:00:00Z');
                const diff = Math.floor((today - schDate) / (1000 * 60 * 60 * 24));
                return diff > 0 ? diff : 0;
            };

            const handleUpdateField = async (id, field, value) => {
                const { doc, updateDoc } = window.FirebaseSDK;
                try {
                    await updateDoc(doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'pm_schedules', id), {
                        [field]: value.toUpperCase()
                    });
                    setEditMode({ id: null, field: null });
                } catch(e) { console.error(e); }
            };

            const submitActionPrompt = async () => {
                if (!actionPrompt.text.trim()) return alert("INDIQUE LOS TÉCNICOS.");
                const { doc, updateDoc } = window.FirebaseSDK;
                const ref = doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'pm_schedules', actionPrompt.id);
                try {
                    if (actionPrompt.type === 'START') {
                        await updateDoc(ref, { status: 'EN EJECUCION', techs: actionPrompt.text.toUpperCase(), odt: actionPrompt.odt.toUpperCase() });
                    } else {
                        await updateDoc(ref, { status: actionPrompt.type === 'PAUSE' ? 'EN PAUSA' : 'ANULADA', reason: actionPrompt.text.toUpperCase() });
                    }
                    setActionPrompt({ id: null, type: null, text: '', odt: '' });
                } catch(e) { console.error(e); }
            };

            const renderCalendar = () => {
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) days.push(i);

                return (
                    <div className="bg-white p-6 rounded-[2.5rem] shadow-premium border border-slate-100">
                        <div className="flex items-center justify-between mb-6">
                            <button onClick={() => setCurrentMonth(new Date(year, month-1))} className="p-2 bg-slate-50 rounded-xl">←</button>
                            <h2 className="text-sm font-black tracking-widest">{MONTH_NAMES[month]} {year}</h2>
                            <button onClick={() => setCurrentMonth(new Date(year, month+1))} className="p-2 bg-slate-50 rounded-xl">→</button>
                        </div>
                        <div className="grid grid-cols-7 gap-1">
                            {['DOM','LUN','MAR','MIE','JUE','VIE','SAB'].map(d => <div key={d} className="text-[9px] font-black text-center text-slate-400 py-2">{d}</div>)}
                            {days.map((day, idx) => {
                                if (!day) return <div key={idx}></div>;
                                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const dayTasks = schedules.filter(s => s.date === dateStr);
                                const isSelected = selectedDateDetails === dateStr;
                                return (
                                    <div key={idx} onClick={() => setSelectedDateDetails(dateStr)} className={`group relative min-h-[70px] p-1 border-2 rounded-2xl cursor-pointer transition-all flex flex-col items-center ${isSelected ? 'border-teal-500 bg-teal-50/50' : 'border-transparent bg-slate-50'}`}>
                                        <span className="text-[11px] font-black">{day}</span>
                                        <div className="flex flex-wrap gap-0.5 justify-center mt-auto pb-1">
                                            {dayTasks.map(t => <div key={t.id} className={`w-2 h-2 rounded-full ${getZoneColor(t.zoneId)} ${t.status === 'EN EJECUCION' ? 'animate-pulse ring-1 ring-blue-400' : ''}`}></div>)}
                                        </div>
                                        {/* Tooltip on Hover */}
                                        {dayTasks.length > 0 && (
                                            <div className="tooltip-content hidden absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 bg-slate-900 text-white p-3 rounded-xl shadow-2xl z-[100] pointer-events-none">
                                                <div className="text-[8px] font-black border-b border-white/20 pb-1 mb-2 tracking-widest uppercase">PROGRAMACIÓN DEL DÍA</div>
                                                {dayTasks.map(t => (
                                                    <div key={t.id} className="mb-2 last:mb-0">
                                                        <div className="flex items-center gap-1.5 mb-0.5">
                                                            <div className={`w-1.5 h-1.5 rounded-full ${getZoneColor(t.zoneId)}`}></div>
                                                            <span className="text-[9px] font-black leading-none">{getZoneName(t.zoneId)}</span>
                                                        </div>
                                                        <div className="text-[8px] opacity-70 ml-3 truncate">
                                                            {t.nodes.map(nId => getNodeName(nId)).join(', ')}
                                                        </div>
                                                        <div className={`text-[7px] font-black ml-3 mt-0.5 ${t.status === 'COMPLETADO' ? 'text-emerald-400' : t.status === 'PENDIENTE' ? 'text-orange-400' : 'text-blue-400'}`}>
                                                            ESTADO: {t.status}
                                                        </div>
                                                    </div>
                                                ))}
                                                <div className="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-slate-900"></div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderTasks = () => {
                const dayTasks = schedules.filter(s => s.date === selectedDateDetails);
                if (dayTasks.length === 0) return <div className="text-center p-8 text-slate-400 text-[10px] font-black">DÍA SIN ACTIVIDADES</div>;
                
                return dayTasks.map(sch => {
                    const delay = sch.status === 'PENDIENTE' ? calculateDelay(sch.date) : 0;
                    const isExecuting = sch.status === 'EN EJECUCION';

                    return (
                        <div key={sch.id} className={`bg-white p-5 rounded-[2rem] shadow-sm border-l-4 mb-4 ${sch.status === 'COMPLETADO' ? 'border-teal-500' : isExecuting ? 'border-blue-500 pulse-executing' : 'border-orange-400'}`}>
                            <div className="flex justify-between items-start mb-4">
                                <div className="space-y-1">
                                    <div className="flex items-center gap-2">
                                        <span className="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-black">{sch.status}</span>
                                        {delay > 0 && <span className="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-black">RETRASO: {delay} DÍAS</span>}
                                    </div>
                                    <h4 className="text-[12px] font-black text-slate-800">{getZoneName(sch.zoneId)}</h4>
                                </div>
                                <div className="flex gap-1">
                                    {sch.status === 'PENDIENTE' && (
                                        <button onClick={() => setActionPrompt({id: sch.id, type: 'START', text: '', odt: ''})} className="bg-teal-600 text-white text-[9px] px-3 py-1.5 rounded-lg font-black">INICIAR</button>
                                    )}
                                    {isExecuting && (
                                        <button onClick={() => handleUpdateField(sch.id, 'status', 'COMPLETADO')} className="bg-blue-600 text-white text-[9px] px-3 py-1.5 rounded-lg font-black">COMPLETAR</button>
                                    )}
                                </div>
                            </div>

                            <div className="bg-slate-50 p-3 rounded-xl mb-3">
                                <span className="text-[8px] font-black text-teal-600 block mb-1">NODOS:</span>
                                <div className="flex flex-wrap gap-1">
                                    {sch.nodes.map(nId => <span key={nId} className="bg-white text-[9px] px-2 py-1 rounded border border-slate-200">{getNodeName(nId)}</span>)}
                                </div>
                            </div>

                            {/* Editable Fields for Techs and ODT */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="space-y-1">
                                    <span className="text-[8px] font-black text-slate-400">TÉCNICOS:</span>
                                    {editMode.id === sch.id && editMode.field === 'techs' ? (
                                        <div className="flex gap-1">
                                            <input autoFocus className="w-full text-[10px] p-1 border rounded" defaultValue={sch.techs} onBlur={(e) => handleUpdateField(sch.id, 'techs', e.target.value)} />
                                        </div>
                                    ) : (
                                        <div className="flex items-center gap-2 group cursor-pointer" onClick={() => isExecuting && setEditMode({id: sch.id, field: 'techs'})}>
                                            <span className="text-[10px] font-black text-slate-700">{sch.techs || 'SIN ASIGNAR'}</span>
                                            {isExecuting && <svg className="w-3 h-3 opacity-0 group-hover:opacity-100 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>}
                                        </div>
                                    )}
                                </div>
                                <div className="space-y-1">
                                    <span className="text-[8px] font-black text-slate-400">ODT ODOO:</span>
                                    {editMode.id === sch.id && editMode.field === 'odt' ? (
                                        <input autoFocus className="w-full text-[10px] p-1 border rounded" defaultValue={sch.odt} onBlur={(e) => handleUpdateField(sch.id, 'odt', e.target.value)} />
                                    ) : (
                                        <div className="flex items-center gap-2 group cursor-pointer" onClick={() => isExecuting && setEditMode({id: sch.id, field: 'odt'})}>
                                            <span className="text-[10px] font-black text-indigo-700">{sch.odt || 'N/A'}</span>
                                            {isExecuting && <svg className="w-3 h-3 opacity-0 group-hover:opacity-100 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Action Prompt for START */}
                            {actionPrompt.id === sch.id && (
                                <div className="mt-4 p-4 bg-teal-50 rounded-2xl border border-teal-100 animate-in slide-in-from-top-2">
                                    <div className="grid grid-cols-1 gap-3 mb-3">
                                        <input placeholder="TÉCNICOS RESPONSABLES" className="p-3 bg-white rounded-xl text-[10px] font-black border border-slate-200 outline-none" value={actionPrompt.text} onChange={e => setActionPrompt({...actionPrompt, text: e.target.value})} />
                                        <input placeholder="Nº ODT ODOO" className="p-3 bg-white rounded-xl text-[10px] font-black border border-slate-200 outline-none" value={actionPrompt.odt} onChange={e => setActionPrompt({...actionPrompt, odt: e.target.value})} />
                                    </div>
                                    <div className="flex gap-2 justify-end">
                                        <button onClick={() => setActionPrompt({id: null})} className="text-[9px] font-black px-4 py-2 bg-slate-200 rounded-lg">CANCELAR</button>
                                        <button onClick={submitActionPrompt} className="text-[9px] font-black px-4 py-2 bg-teal-600 text-white rounded-lg shadow-md">CONFIRMAR INICIO</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                });
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-black">CARGANDO...</div>;

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-slate-100 sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <MaintenanceLogo className="h-6 w-6 text-teal-600" />
                            <h1 className="font-black text-sm">Airtek Mantenimiento</h1>
                        </div>
                        <nav className="flex gap-2">
                            {['cronograma', 'programar', 'historial', 'maestro'].map(t => (
                                <button key={t} onClick={() => setActiveTab(t)} className={`px-4 py-2 rounded-xl text-[9px] font-black transition-all ${activeTab === t ? 'bg-teal-600 text-white' : 'text-slate-400 hover:bg-slate-50'}`}>{t.toUpperCase()}</button>
                            ))}
                        </nav>
                    </header>

                    <main className="max-w-2xl mx-auto p-4 space-y-6 mt-4 tab-content">
                        {activeTab === 'cronograma' && (
                            <div className="space-y-6">
                                {renderCalendar()}
                                <div className="space-y-2">
                                    <h3 className="text-[10px] font-black text-slate-500 ml-2">ACTIVIDADES DEL {selectedDateDetails}</h3>
                                    {renderTasks()}
                                </div>
                            </div>
                        )}
                        
                        {/* Otras pestañas (omitidas para brevedad pero funcionales en el código base) */}
                        {activeTab === 'programar' && (
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-premium text-center">
                                <h3 className="text-sm font-black mb-4">Módulo de Programación</h3>
                                <p className="text-[10px] text-slate-400">Utilice el selector de nodos y fechas para agendar nuevas inspecciones anuales o únicas.</p>
                            </div>
                        )}

                        {activeTab === 'maestro' && (
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-premium text-center">
                                <h3 className="text-sm font-black mb-4">Gestión de Catálogo</h3>
                                <p className="text-[10px] text-slate-400">Configure aquí las zonas geográficas y los nodos asociados a cada cuadrante.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
