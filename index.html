const OdtIco    = () => <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="4" rx="1" ry="1"/><path strokeLinecap="round" strokeLinejoin="round" d="M9 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2h-3"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>;
const ClockIco  = () => <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

// ── Helpers ──
const todayMidnight = () => new Date(new Date().setHours(0,0,0,0));
const calcDelay = (dateStr, status) => {
    if (status !== 'PENDIENTE' && status !== 'EN PAUSA') return 0;
    const schDate = new Date(dateStr + 'T00:00:00Z');
    const diff = Math.floor((todayMidnight() - schDate) / 86400000);
    return diff > 0 ? diff : 0;
};
const statusClass = (s, isPast) => s==='COMPLETADO'?'s-completed':s==='EN EJECUCION'?'s-executing':s==='EN PAUSA'?'s-paused':s==='ANULADA'?'s-cancelled':isPast?'s-overdue':'s-pending';
const badgeClass  = (s, isPast) => s==='COMPLETADO'?'b-completed':s==='EN EJECUCION'?'b-executing':s==='EN PAUSA'?'b-paused':s==='ANULADA'?'b-cancelled':isPast?'b-overdue':'b-pending';
const statusLabel = (s, isPast, delay) => {
    if(s==='COMPLETADO') return '✓ COMPLETADO';
    if(s==='EN EJECUCION') return '● EN EJECUCIÓN';
    if(s==='EN PAUSA') return `⏸ EN PAUSA${delay>0?' · '+delay+'D':''}`;
    if(s==='ANULADA') return '✕ ANULADA';
    if(isPast) return `⚠ VENCIDA · ${delay}D`;
    return '○ PENDIENTE';
};
const ttStatusClass = (s,isPast) => s==='COMPLETADO'?'tt-completed':s==='EN EJECUCION'?'tt-executing':s==='EN PAUSA'?'tt-paused':s==='ANULADA'?'tt-cancelled':isPast?'tt-overdue':'tt-pending';

// ════════════════════════════════════════════
const App = () => {
    const [user,setUser]           = useState(null);
    const [loading,setLoading]     = useState(true);
    const [isCloud,setIsCloud]     = useState(false);
    const [activeTab,setActiveTab] = useState('cronograma');
    const [adminSec,setAdminSec]   = useState('zona');
    const [isAdmin,setIsAdmin]     = useState(false);

    const [zones,setZones]         = useState([]);
    const [nodes,setNodes]         = useState([]);
    const [schedules,setSchedules] = useState([]);

    const [newZone,setNewZone]     = useState({ name:'', color:ZONE_COLORS[0] });
    const [newNode,setNewNode]     = useState({ name:'', zoneId:'' });
    const [newSch,setNewSch]       = useState({ date:'', zoneId:'', selectedNodes:[], recurring:false, repeatDays:30 });

    // action prompt: START / PAUSE / CANCEL
    const [actionP,setActionP]     = useState({ id:null, type:null, techs:'', odt:'', reason:'' });
    // edit prompt: edit techs + ODT on active/paused/completed
    const [editP,setEditP]         = useState({ id:null, techs:'', odt:'' });
    // delete confirm
    const [delP,setDelP]           = useState({ isOpen:false, schedule:null });

    // Calendar state
    const [curMonth,setCurMonth]   = useState(new Date());
    const [selDate,setSelDate]     = useState(TODAY_STR);

    // Hover tooltip
    const [tooltip,setTooltip]     = useState({ visible:false, x:0, y:0, date:'' });
    const tooltipTimer             = useRef(null);

    // Filters - calendar
    const [filterZone,setFilterZone]     = useState('');
    const [filterStatus,setFilterStatus] = useState('');
    // Filters - history
    const [histFilterZone,setHistFilterZone]   = useState('');
    const [histFilterNode,setHistFilterNode]   = useState('');
    const [histFilterTech,setHistFilterTech]   = useState('');

    const dbRef = useRef(null);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-pm-app-id';

    // ── Firebase init ──
    useEffect(() => {
        const init = async () => {
            if (!window.FirebaseSDK) return;
            const { initializeApp, getAuth, getFirestore, signInAnonymously, onAuthStateChanged, signInWithCustomToken } = window.FirebaseSDK;
            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : window.__firebase_config_manual;
                const app = initializeApp(JSON.parse(configStr));
                dbRef.current = getFirestore(app);
                const auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                const unsub = onAuthStateChanged(auth, u => { if(u){setUser(u);setIsCloud(true);} setLoading(false); });
                return unsub;
            } catch(e) { setLoading(false); }
        };
        window.addEventListener('firebase-ready', init);
        if (window.FirebaseSDK) init();
        return () => window.removeEventListener('firebase-ready', init);
    }, []);

    // ── Firestore listeners ──
    useEffect(() => {
        if (!user || !dbRef.current) return;
        const { collection, onSnapshot } = window.FirebaseSDK;
        const base = ['artifacts', appId, 'public', 'data'];
        const unZ = onSnapshot(collection(dbRef.current, ...base, 'pm_zones'),     s => setZones(s.docs.map(d=>({...d.data(),id:d.id}))), e=>console.error(e));
        const unN = onSnapshot(collection(dbRef.current, ...base, 'pm_nodes'),     s => setNodes(s.docs.map(d=>({...d.data(),id:d.id}))), e=>console.error(e));
        const unS = onSnapshot(collection(dbRef.current, ...base, 'pm_schedules'), s => {
            const data = s.docs.map(d=>({...d.data(),id:d.id}));
            data.sort((a,b)=>new Date(a.date)-new Date(b.date));
            setSchedules(data);
        }, e=>console.error(e));
        return () => { unZ(); unN(); unS(); };
    }, [user, appId]);

    // ── Derived data ──
    const getZoneName  = useCallback(id => zones.find(z=>z.id===id)?.name || 'DESCONOCIDA', [zones]);
    const getZoneColor = useCallback(id => zones.find(z=>z.id===id)?.color || 'bg-slate-500', [zones]);
    const getZoneHex   = useCallback(id => COLOR_HEX[zones.find(z=>z.id===id)?.color] || '#94a3b8', [zones]);
    const getNodeName  = useCallback(id => nodes.find(n=>n.id===id)?.name || 'NODO ELIMINADO', [nodes]);

    const formatDate = ds => {
        if(!ds) return '';
        return new Date(ds+'T00:00:00Z').toLocaleDateString('es-VE',{weekday:'long',year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).toUpperCase();
    };

    // Stats
    const stats = useMemo(() => {
        const today = TODAY_STR;
        let pending=0, executing=0, overdue=0, done=0;
        schedules.forEach(s => {
            if(s.status==='COMPLETADO') done++;
            else if(s.status==='EN EJECUCION') executing++;
            else if(s.status==='PENDIENTE' && s.date < today) overdue++;
            else if(s.status==='PENDIENTE') pending++;
        });
        return { pending, executing, overdue, done };
    }, [schedules]);

    // Filtered schedules for day detail
    const daySchedules = useMemo(() => {
        return schedules.filter(s => {
            if(s.date !== selDate) return false;
            if(filterZone && s.zoneId !== filterZone) return false;
            if(filterStatus && s.status !== filterStatus) return false;
            return true;
        });
    }, [schedules, selDate, filterZone, filterStatus]);

    // By date map for calendar
    const byDate = useMemo(() => {
        const map = {};
        schedules.forEach(s => {
            if(!map[s.date]) map[s.date] = [];
            map[s.date].push(s);
        });
        return map;
    }, [schedules]);

    const nodesInZone = useMemo(() => nodes.filter(n=>n.zoneId===newSch.zoneId), [nodes, newSch.zoneId]);

    // ── Calendar nav ──
    const prevMonth = () => setCurMonth(new Date(curMonth.getFullYear(), curMonth.getMonth()-1, 1));
    const nextMonth = () => setCurMonth(new Date(curMonth.getFullYear(), curMonth.getMonth()+1, 1));
    const goToday   = () => { setCurMonth(new Date()); setSelDate(TODAY_STR); };

    // ── Tooltip ──
    const showTooltip = (e, dateStr) => {
        clearTimeout(tooltipTimer.current);
        tooltipTimer.current = setTimeout(() => {
            const rect = e.currentTarget.getBoundingClientRect();
            const tooltipW = 270;
            let x = rect.left + rect.width / 2;
            let y = rect.bottom + 10;
            // Clamp horizontal
            if (x + tooltipW / 2 > window.innerWidth - 8) x = window.innerWidth - tooltipW / 2 - 8;
            if (x - tooltipW / 2 < 8) x = tooltipW / 2 + 8;
            // Flip above cell if not enough space below
            if (y + 280 > window.innerHeight) y = rect.top - 10;
            setTooltip({ visible: true, x, y, date: dateStr, above: y < rect.top });
        }, 120);
    };
    const hideTooltip = () => { clearTimeout(tooltipTimer.current); setTooltip(t => ({ ...t, visible: false })); };

    // ── CRUD ──
    const db = (col) => {
        const { collection } = window.FirebaseSDK;
        return collection(dbRef.current, 'artifacts', appId, 'public', 'data', col);
    };
    const docRef = (col, id) => { const { doc } = window.FirebaseSDK; return doc(dbRef.current, 'artifacts', appId, 'public', 'data', col, id); };

    const handleAddZone = async e => {
        e.preventDefault(); if(!newZone.name.trim()) return;
        const { addDoc, serverTimestamp } = window.FirebaseSDK;
        try { await addDoc(db('pm_zones'), { name:newZone.name.toUpperCase(), color:newZone.color, createdAt:serverTimestamp() }); setNewZone({name:'',color:ZONE_COLORS[0]}); } catch(e){console.error(e);}
    };
    const handleUpdateZoneColor = async (zoneId, color) => {
        const { updateDoc } = window.FirebaseSDK;
        try { await updateDoc(docRef('pm_zones', zoneId), {color}); } catch(e){console.error(e);}
    };
    const handleAddNode = async e => {
        e.preventDefault(); if(!newNode.name.trim()||!newNode.zoneId) return;
        const { addDoc, serverTimestamp } = window.FirebaseSDK;
        try { await addDoc(db('pm_nodes'), { name:newNode.name.toUpperCase(), zoneId:newNode.zoneId, createdAt:serverTimestamp() }); setNewNode({name:'',zoneId:''}); } catch(e){console.error(e);}
    };
    const deleteItem = async (col, id, name) => {
        if(!confirm(`¿ELIMINAR: ${name}?`)) return;
        const { deleteDoc } = window.FirebaseSDK;
        try { await deleteDoc(docRef(col, id)); } catch(e){console.error(e);}
    };
    const toggleNode = id => {
        const cur = newSch.selectedNodes;
        if(cur.includes(id)) { setNewSch({...newSch, selectedNodes:cur.filter(x=>x!==id)}); }
        else { if(cur.length>=5){ alert("MÁXIMO 5 NODOS/DÍA."); return; } setNewSch({...newSch, selectedNodes:[...cur,id]}); }
    };

    const handleSaveSchedule = async e => {
        e.preventDefault();
        if(!newSch.date||!newSch.zoneId||newSch.selectedNodes.length===0){ alert("SELECCIONE FECHA, ZONA Y AL MENOS UN NODO."); return; }
        if(newSch.recurring&&newSch.repeatDays<=0){ alert("INTERVALO DEBE SER > 0."); return; }
        const { serverTimestamp:sTs, writeBatch:wb } = window.FirebaseSDK;
        const batch = wb(dbRef.current);
        const schCol = db('pm_schedules');
        // groupId links ALL nodes of this scheduling session across all dates
        const groupId = newSch.recurring ? Date.now().toString() : null;

        let nd = new Date(newSch.date+'T00:00:00Z');
        const ed = new Date(nd);
        if(newSch.recurring) ed.setFullYear(ed.getFullYear()+1);

        // Track (date → slotsUsed) within this batch to check capacity
        const batchSlots = {};
        const saved = [];

        while(nd<=ed){
            // Skip weekends
            let dow = nd.getUTCDay();
            if(dow===6) nd.setUTCDate(nd.getUTCDate()+2);
            if(dow===0) nd.setUTCDate(nd.getUTCDate()+1);

            // Find a date with enough slots for ALL selected nodes (1 slot each)
            let found=false, cd=new Date(nd);
            for(let i=0;i<30;i++){
                let cdd=cd.getUTCDay();
                if(cdd!==6&&cdd!==0){
                    let ds=cd.toISOString().split('T')[0];
                    // Existing inspections in DB for this date
                    let existingCount = schedules.filter(s=>s.date===ds).length;
                    // Slots already queued in this batch
                    let batchCount = batchSlots[ds] || 0;
                    if(existingCount + batchCount + newSch.selectedNodes.length <= 5){
                        found=true; nd=new Date(cd); break;
                    }
                }
                cd.setUTCDate(cd.getUTCDate()+1);
            }
            if(!found){alert("SIN ESPACIO (MÁX 5 INSPECC./DÍA) EN FECHAS CERCANAS.");break;}

            const ds=nd.toISOString().split('T')[0];
            saved.push(ds);
            batchSlots[ds] = (batchSlots[ds]||0) + newSch.selectedNodes.length;

            // One document per node
            newSch.selectedNodes.forEach(nodeId => {
                const { doc:fd } = window.FirebaseSDK;
                const ref = fd(schCol);
                batch.set(ref, {
                    date: ds,
                    zoneId: newSch.zoneId,
                    nodeId,                      // single node per inspection
                    nodes: [nodeId],             // kept for backward compat display
                    techs: '', odt: '', reason: '',
                    status: 'PENDIENTE',
                    createdAt: sTs(),
                    isRecurring: newSch.recurring,
                    groupId,
                    repeatDays: newSch.recurring ? Number(newSch.repeatDays) : null
                });
            });

            if(!newSch.recurring) break;
            nd.setUTCDate(nd.getUTCDate()+Number(newSch.repeatDays));
        }
        try {
            await batch.commit();
            setSelDate(saved[0]);
            setNewSch({date:'',zoneId:'',selectedNodes:[],recurring:false,repeatDays:30});
            const fd0=new Date(saved[0]+'T00:00:00Z');
            setCurMonth(new Date(fd0.getFullYear(),fd0.getMonth(),1));
            setActiveTab('cronograma');
            const totalDocs = saved.length * newSch.selectedNodes.length;
            alert(`GUARDADO · ${saved.length} FECHA(S) · ${totalDocs} INSPECCIÓN(ES) CREADAS`);
        } catch(e){console.error(e);alert("ERROR: "+e.message);}
    };

    // ── Action prompt (START/PAUSE/CANCEL) ──
    const triggerAction = (id, type, sch) => {
        if(type==='START') setActionP({ id, type, techs: sch.techs||'', odt: sch.odt||'', reason:'' });
        else setActionP({ id, type, techs:'', odt:'', reason:'' });
    };
    const submitAction = async () => {
        const { updateDoc } = window.FirebaseSDK;
        const ref = docRef('pm_schedules', actionP.id);
        try {
            if(actionP.type==='START'){
                if(!actionP.techs.trim()){alert("INGRESE LOS TÉCNICOS.");return;}
                await updateDoc(ref,{ status:'EN EJECUCION', techs:actionP.techs.toUpperCase(), odt:actionP.odt.toUpperCase(), reason:'' });
            } else if(actionP.type==='PAUSE'){
                if(!actionP.reason.trim()){alert("INGRESE EL MOTIVO.");return;}
                await updateDoc(ref,{ status:'EN PAUSA', reason:actionP.reason.toUpperCase() });
            } else if(actionP.type==='CANCEL'){
                if(!actionP.reason.trim()){alert("INGRESE EL MOTIVO.");return;}
                await updateDoc(ref,{ status:'ANULADA', reason:actionP.reason.toUpperCase() });
            }
            setActionP({id:null,type:null,techs:'',odt:'',reason:''});
        } catch(e){console.error(e);}
    };

    // ── Edit (techs + ODT) ──
    const triggerEdit = (sch) => setEditP({ id:sch.id, techs:sch.techs||'', odt:sch.odt||'' });
    const submitEdit = async () => {
        if(!editP.techs.trim()){alert("INGRESE LOS TÉCNICOS.");return;}
        const { updateDoc } = window.FirebaseSDK;
        try {
            await updateDoc(docRef('pm_schedules', editP.id), { techs:editP.techs.toUpperCase(), odt:editP.odt.toUpperCase() });
            setEditP({id:null,techs:'',odt:''});
        } catch(e){console.error(e);}
    };

    const handleStatusChange = async (sch, status) => {
        const { updateDoc } = window.FirebaseSDK;
        try {
            let upd = {status};
            if(status==='PENDIENTE') upd.reason='';
            await updateDoc(docRef('pm_schedules', sch.id), upd);
        } catch(e){console.error(e);}
    };

    const promptDelete = sch => {
        if(sch.groupId) setDelP({isOpen:true,schedule:sch});
        else deleteItem('pm_schedules', sch.id, 'ESTA PROGRAMACIÓN');
    };
    const confirmDel = async mode => {
        const { deleteDoc:dd, writeBatch:wb } = window.FirebaseSDK;
        try {
            if(mode==='SINGLE'){ await dd(docRef('pm_schedules', delP.schedule.id)); }
            else {
                const list = schedules.filter(s=>s.groupId===delP.schedule.groupId);
                const batch = wb(dbRef.current);
                list.forEach(s=>batch.delete(docRef('pm_schedules',s.id)));
                await batch.commit();
                alert(`${list.length} MANTENIMIENTOS ELIMINADOS.`);
            }
        } catch(e){console.error(e);}
        setDelP({isOpen:false,schedule:null});
    };

    const exportPDF = () => {
        if(!window.jspdf?.jsPDF){alert("PDF cargando...");return;}
        const docPdf = new window.jspdf.jsPDF();
        const done = schedules.filter(s=>s.status==='COMPLETADO');
        if(!done.length){alert("NO HAY COMPLETADOS.");return;}
        docPdf.setFontSize(16); docPdf.setTextColor(13,148,136);
        docPdf.text("HISTORIAL PM – AIRTEK ZULIA", 14, 20);
        docPdf.setFontSize(9); docPdf.setTextColor(100,116,139);
        docPdf.text(`Generado: ${new Date().toLocaleDateString('es-VE')}`, 14, 28);
        docPdf.autoTable({
            startY:34,
            head:[['FECHA','ODT','ZONA','NODO','TÉCNICOS']],
            body:done.map(s=>{
                const nid = s.nodeId || (s.nodes&&s.nodes[0]);
                return [formatDate(s.date),s.odt||'—',getZoneName(s.zoneId),getNodeName(nid),s.techs||'NO REG.'];
            }),
            headStyles:{fillColor:[13,148,136]},
            styles:{fontSize:7,cellPadding:3},
            alternateRowStyles:{fillColor:[248,250,252]}
        });
        docPdf.save("Historial_Airtek.pdf");
    };

    // ════════════════════════════════════════════
    // CALENDAR COMPONENT
    // ════════════════════════════════════════════
    const Calendar = () => {
        const year  = curMonth.getFullYear();
        const month = curMonth.getMonth();
        const firstDay = new Date(year,month,1).getDay();
        const days     = new Date(year,month+1,0).getDate();
        const cells = [];
        for(let i=0;i<firstDay;i++) cells.push(null);
        for(let i=1;i<=days;i++)    cells.push(i);

        // check if any day in view has overdue
        const hasOverdueInRange = cells.some(d => {
            if(!d) return false;
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            return (byDate[ds]||[]).some(s=>s.status==='PENDIENTE'&&ds<TODAY_STR);
        });

        return (
            <div className="card card-xl p-4 sm:p-5" style={{position:'relative'}}>
                {delP.isOpen && (
                    <div className="del-overlay">
                        <div className="del-modal">
                            <div style={{width:48,height:48,background:'#fef2f2',color:'#ef4444',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><TrashIco /></div>
                            <div style={{fontSize:'.68rem',fontWeight:900,marginBottom:6}}>TAREA RECURRENTE</div>
                            <div style={{fontSize:'.6rem',color:'var(--muted)',lineHeight:1.5,marginBottom:18}}>Esta inspección pertenece a una serie programada.</div>
                            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                <button onClick={()=>confirmDel('SERIES')} className="btn" style={{background:'#ef4444',color:'#fff',width:'100%',padding:'12px',boxShadow:'0 3px 12px rgba(239,68,68,.3)'}}>ELIMINAR TODA LA SERIE</button>
                                <button onClick={()=>confirmDel('SINGLE')} className="btn btn-pause" style={{width:'100%',padding:'12px'}}>SOLO ESTA FECHA</button>
                                <button onClick={()=>setDelP({isOpen:false,schedule:null})} className="btn btn-reopen" style={{width:'100%',padding:'10px',marginTop:4}}>CANCELAR</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Header */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                    <button onClick={prevMonth} className="btn btn-reopen" style={{padding:'7px',borderRadius:'10px'}}><ChevL /></button>
                    <div style={{textAlign:'center'}}>
                        <div className="cal-hdr">{MONTH_NAMES[month]} {year}</div>
                        {hasOverdueInRange && <div style={{fontSize:'.55rem',color:'#ef4444',fontWeight:800,letterSpacing:'.1em',marginTop:2}}>⚠ HAY TAREAS VENCIDAS</div>}
                    </div>
                    <button onClick={nextMonth} className="btn btn-reopen" style={{padding:'7px',borderRadius:'10px'}}><ChevR /></button>
                </div>

                {/* Day labels */}
                <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px',marginBottom:4}}>
                    {['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'].map(d=>(
                        <div key={d} className="cal-day-lbl">{d}</div>
                    ))}
                </div>

                {/* Cells */}
                <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px'}}>
                    {cells.map((day,idx) => {
                        if(!day) return <div key={`e${idx}`} />;
                        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                        const ds_scheds  = byDate[ds]||[];
                        const isSelected = selDate===ds;
                        const isToday    = TODAY_STR===ds;
                        const hasOverdue = ds_scheds.some(s=>s.status==='PENDIENTE'&&ds<TODAY_STR);

                        return (
                            <div
                                key={idx}
                                onClick={()=>setSelDate(ds)}
                                onMouseEnter={e=>{if(ds_scheds.length>0) showTooltip(e,ds);}}
                                onMouseLeave={hideTooltip}
                                className={`cal-cell${isSelected?' cal-active':''}`}
                            >
                                {hasOverdue && <span className="cell-overdue-dot" />}
                                <div className={`cal-num ${isToday?'cal-num-today':isSelected?'cal-num-selected':'cal-num-normal'}`}>{day}</div>
                                <div className="cal-dots">
                                    {ds_scheds.map((s,i) => {
                                        const ic = s.status==='ANULADA'?'#fca5a5':s.status==='EN PAUSA'?'#fcd34d':s.status==='EN EJECUCION'?'#93c5fd':s.status==='COMPLETADO'?'#6ee7b7':null;
                                        return (
                                            <div
                                                key={i}
                                                className={`cal-dot ${!ic?getZoneColor(s.zoneId):''} ${s.status==='EN EJECUCION'?'animate-pulse':''}`}
                                                style={ic?{background:ic}:{}}
                                                title={`${getZoneName(s.zoneId)} · ${s.status}`}
                                            />
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })}
                </div>

                {/* Legend */}
                <div style={{display:'flex',flexWrap:'wrap',gap:'10px',marginTop:14,paddingTop:12,borderTop:'1px solid var(--border)'}}>
                    {[
                        {color:'#93c5fd',label:'EN EJECUCIÓN'},
                        {color:'#fcd34d',label:'EN PAUSA'},
                        {color:'#6ee7b7',label:'COMPLETADO'},
                        {color:'#fca5a5',label:'ANULADO'},
                    ].map(l=>(
                        <div key={l.label} style={{display:'flex',alignItems:'center',gap:5}}>
                            <div style={{width:8,height:8,borderRadius:'50%',background:l.color,flexShrink:0}} />
                            <span style={{fontSize:'.55rem',fontWeight:800,letterSpacing:'.1em',color:'var(--muted)'}}>{l.label}</span>
                        </div>
                    ))}
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                        <div style={{width:8,height:8,borderRadius:'50%',background:'#ef4444',flexShrink:0,boxShadow:'0 0 0 2px rgba(239,68,68,.25)'}} />
                        <span style={{fontSize:'.55rem',fontWeight:800,letterSpacing:'.1em',color:'var(--muted)'}}>VENCIDA</span>
                    </div>
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════
    // HOVER TOOLTIP COMPONENT
    // ════════════════════════════════════════════
    const DayTooltip = () => {
        if (!tooltip.visible) return null;
        const inspections = byDate[tooltip.date] || [];
        if (!inspections.length) return null;
        const free = 5 - inspections.length;

        // Status config
        const stCfg = s => {
            const isPast = s.date < TODAY_STR && s.status === 'PENDIENTE';
            if (s.status === 'COMPLETADO')   return { label: '✓ COMPLETADO',   bg: 'rgba(110,231,183,.18)', color: '#6ee7b7' };
            if (s.status === 'EN EJECUCION') return { label: '● EN EJECUCIÓN', bg: 'rgba(147,197,253,.18)', color: '#93c5fd' };
            if (s.status === 'EN PAUSA')     return { label: '⏸ EN PAUSA',     bg: 'rgba(252,211,77,.18)',  color: '#fcd34d' };
            if (s.status === 'ANULADA')      return { label: '✕ ANULADA',      bg: 'rgba(252,165,165,.18)', color: '#fca5a5' };
            if (isPast)                      return { label: '⚠ VENCIDA',       bg: 'rgba(239,68,68,.2)',   color: '#f87171' };
            return                                  { label: '○ PENDIENTE',     bg: 'rgba(253,186,116,.15)', color: '#fdba74' };
        };

        return (
            <div
                className="day-tooltip"
                style={{
                    left: tooltip.x,
                    top: tooltip.above ? 'auto' : tooltip.y,
                    bottom: tooltip.above ? (window.innerHeight - tooltip.y) + 'px' : 'auto',
                    transform: 'translateX(-50%)',
                    width: 270,
                    minWidth: 'unset',
                    maxWidth: 'unset',
                }}
            >
                {/* Header */}
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                    <div style={{ fontSize:'.58rem', fontWeight:800, letterSpacing:'.12em', color:'rgba(255,255,255,.4)' }}>
                        {formatDate(tooltip.date)}
                    </div>
                    <div style={{ fontSize:'.58rem', fontWeight:800, color: free===0?'#f87171':'rgba(255,255,255,.3)', letterSpacing:'.08em' }}>
                        {inspections.length}/5
                    </div>
                </div>

                {/* One row per inspection */}
                {inspections.map((s, idx) => {
                    const nodeId = s.nodeId || (s.nodes && s.nodes[0]);
                    const delay  = calcDelay(s.date, s.status);
                    const cfg    = stCfg(s);
                    const hex    = getZoneHex(s.zoneId);
                    return (
                        <div
                            key={s.id}
                            style={{
                                display: 'flex', alignItems: 'flex-start', gap: 10,
                                padding: '8px 0',
                                borderTop: idx === 0 ? '1px solid rgba(255,255,255,.08)' : '1px solid rgba(255,255,255,.06)',
                            }}
                        >
                            {/* Number + zone dot */}
                            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, flexShrink:0 }}>
                                <div style={{
                                    width: 20, height: 20, borderRadius: '50%',
                                    background: hex, opacity: .9,
                                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    fontSize: '.55rem', fontWeight: 900, color: '#fff', flexShrink: 0,
                                    boxShadow: `0 0 0 2px ${hex}40`
                                }}>
                                    {idx + 1}
                                </div>
                            </div>

                            {/* Content */}
                            <div style={{ flex: 1, minWidth: 0 }}>
                                {/* Node name */}
                                <div style={{
                                    fontFamily: "'JetBrains Mono', monospace",
                                    fontSize: '.7rem', fontWeight: 700,
                                    color: '#f1f5f9', marginBottom: 4,
                                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                                }}>
                                    {getNodeName(nodeId)}
                                </div>

                                {/* Status pill */}
                                <div style={{ display:'flex', flexWrap:'wrap', gap:4, alignItems:'center' }}>
                                    <span style={{
                                        fontSize: '.56rem', fontWeight: 800, letterSpacing: '.07em',
                                        padding: '2px 8px', borderRadius: 999,
                                        background: cfg.bg, color: cfg.color,
                                        border: `1px solid ${cfg.color}40`,
                                    }}>
                                        {cfg.label}
                                    </span>
                                    {delay > 0 && (
                                        <span style={{
                                            fontSize: '.54rem', fontWeight: 800, color: '#fca5a5',
                                            background: 'rgba(239,68,68,.18)', padding: '2px 6px',
                                            borderRadius: 999, border: '1px solid rgba(239,68,68,.3)',
                                        }}>
                                            {delay}D RETRASO
                                        </span>
                                    )}
                                </div>

                                {/* Techs / ODT if set */}
                                {(s.techs || s.odt) && (
                                    <div style={{ marginTop: 4, display:'flex', gap:5, flexWrap:'wrap' }}>
                                        {s.odt   && <span style={{ fontSize:'.53rem', fontWeight:800, color:'#c4b5fd', background:'rgba(168,85,247,.15)', padding:'1px 6px', borderRadius:4 }}>ODT:{s.odt}</span>}
                                        {s.techs && <span style={{ fontSize:'.53rem', fontWeight:600, color:'rgba(255,255,255,.3)' }}>{s.techs}</span>}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                })}

                {/* Footer */}
                <div style={{
                    marginTop: 8, paddingTop: 8,
                    borderTop: '1px solid rgba(255,255,255,.08)',
                    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                }}>
                    <span style={{ fontSize:'.56rem', fontWeight:700, color:'rgba(255,255,255,.3)', letterSpacing:'.08em' }}>
                        {free > 0 ? `${free} SLOT${free!==1?'S':''} DISPONIBLE${free!==1?'S':''}` : 'DÍA COMPLETO'}
                    </span>
                    {free === 0 && (
                        <span style={{ fontSize:'.54rem', fontWeight:800, color:'#f87171', background:'rgba(239,68,68,.15)', padding:'2px 7px', borderRadius:999 }}>LLENO</span>
                    )}
                </div>
            </div>
        );
    };

    // ════════════════════════════════════════════
    // SCHEDULE CARD COMPONENT
    // ════════════════════════════════════════════
    const SchCard = ({sch}) => {
        const isCompleted = sch.status==='COMPLETADO';
        const isExecuting = sch.status==='EN EJECUCION';
        const isPaused    = sch.status==='EN PAUSA';
        const isCancelled = sch.status==='ANULADA';
        const isPending   = sch.status==='PENDIENTE';
        const schDate     = new Date(sch.date+'T00:00:00Z');
        const isPast      = schDate < todayMidnight() && isPending;
        const delay       = calcDelay(sch.date, sch.status);
        const zColor      = getZoneColor(sch.zoneId);
        const sCls        = statusClass(sch.status, isPast);
        const bCls        = badgeClass(sch.status, isPast);
        const sLbl        = statusLabel(sch.status, isPast, delay);
        const isBeingActioned = actionP.id === sch.id;
        const isBeingEdited   = editP.id   === sch.id;
        const canEdit = isExecuting || isPaused || isCompleted;

        return (
            <div className={`sch-card ${sCls}`}>
                {/* Row 1: badges */}
                <div style={{display:'flex',flexWrap:'wrap',gap:7,alignItems:'center',marginBottom:12}}>
                    <span className={`badge ${bCls}`}>{sLbl}</span>
                    {delay > 0 && <span className="badge b-delay"><ClockIco /> {delay}D RETRASO</span>}
                    <div className="zone-chip">
                        <span className={`zdot ${isCancelled?'bg-red-200':zColor}`} />
                        <span style={isCancelled?{textDecoration:'line-through',opacity:.5}:{}}>{getZoneName(sch.zoneId)}</span>
                    </div>
                    {sch.odt && <span className="badge b-odt"><OdtIco /> ODT: {sch.odt}</span>}
                    {sch.isRecurring && <span className="badge b-recurring"><RepeatIco /> CADA {sch.repeatDays}D</span>}
                </div>

                {/* Row 2: node (single per inspection) */}
                <div className={`node-box${isCancelled?' opacity-50':''}`} style={{marginBottom:10}}>
                    <div className="node-box-lbl">NODO A INTERVENIR</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                        {(() => {
                            const nid = sch.nodeId || (sch.nodes && sch.nodes[0]);
                            return nid ? <span className="node-tag">{getNodeName(nid)}</span> : null;
                        })()}
                    </div>
                </div>

                {/* Reason */}
                {sch.reason && (
                    <div className={`reason-box ${isCancelled?'reason-cancelled':'reason-paused'}`} style={{marginBottom:10}}>
                        MOTIVO: {sch.reason}
                    </div>
                )}

                {/* Techs */}
                {sch.techs && !isCancelled && (
                    <div className="tech-chip" style={{marginBottom:10}}>
                        <UserIco />
                        TÉCNICOS: <strong>{sch.techs}</strong>
                    </div>
                )}

                {/* Action buttons */}
                {!isBeingActioned && !isBeingEdited && (
                    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
                        {isPending && <>
                            <button onClick={()=>triggerAction(sch.id,'START',sch)} className="btn btn-start"><PlayIco /> INICIAR</button>
                            <button onClick={()=>triggerAction(sch.id,'PAUSE',sch)} className="btn btn-pause"><PauseIco /> PAUSAR</button>
                            <button onClick={()=>triggerAction(sch.id,'CANCEL',sch)} className="btn btn-cancel"><BanIco /> ANULAR</button>
                        </>}
                        {isExecuting && <>
                            <button onClick={()=>handleStatusChange(sch,'COMPLETADO')} className="btn btn-complete"><CheckIco /> COMPLETAR</button>
                            <button onClick={()=>triggerAction(sch.id,'PAUSE',sch)} className="btn btn-pause"><PauseIco /> PAUSAR</button>
                            <button onClick={()=>triggerAction(sch.id,'CANCEL',sch)} className="btn btn-cancel"><BanIco /> ANULAR</button>
                        </>}
                        {isPaused && <>
                            <button onClick={()=>handleStatusChange(sch,'EN EJECUCION')} className="btn btn-resume"><PlayIco /> REANUDAR</button>
                            <button onClick={()=>triggerAction(sch.id,'CANCEL',sch)} className="btn btn-cancel"><BanIco /> ANULAR</button>
                        </>}
                        {(isCancelled||isCompleted) && (
                            <button onClick={()=>handleStatusChange(sch,'PENDIENTE')} className="btn btn-reopen">↺ REABRIR</button>
                        )}
                        {/* Edit button for active/paused/completed */}
                        {canEdit && (
                            <button onClick={()=>triggerEdit(sch)} className="btn btn-edit"><EditIco /> EDITAR INFO</button>
                        )}
                        {isAdmin && (
                            <button onClick={()=>promptDelete(sch)} className="btn btn-delete" style={{marginLeft:'auto'}}><TrashIco /></button>
                        )}
                    </div>
                )}

                {/* START prompt (techs + ODT) */}
                {isBeingActioned && actionP.type==='START' && (
                    <div className="prompt-box" style={{marginTop:12}}>
                        <div className="prompt-lbl" style={{color:'var(--primary)'}}>ASIGNAR TÉCNICOS Y ORDEN DE TRABAJO</div>
                        <div style={{display:'flex',flexDirection:'column',gap:8}}>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'var(--primary)'}}>TÉCNICOS ASIGNADOS</label>
                                <input
                                    className="prompt-inp"
                                    placeholder="EJ: L. RAMOS, D. CHACÍN"
                                    value={actionP.techs}
                                    onChange={e=>setActionP({...actionP,techs:e.target.value})}
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>NÚMERO ODT (OPCIONAL)</label>
                                <input
                                    className="prompt-inp odt"
                                    placeholder="EJ: ODT-2025-001"
                                    value={actionP.odt}
                                    onChange={e=>setActionP({...actionP,odt:e.target.value})}
                                    onKeyDown={e=>e.key==='Enter'&&submitAction()}
                                />
                            </div>
                            <div style={{display:'flex',gap:6}}>
                                <button onClick={()=>setActionP({id:null,type:null,techs:'',odt:'',reason:''})} className="btn btn-reopen">CANCELAR</button>
                                <button onClick={submitAction} className="btn btn-start">GUARDAR E INICIAR</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* PAUSE / CANCEL prompt */}
                {isBeingActioned && (actionP.type==='PAUSE'||actionP.type==='CANCEL') && (
                    <div className="prompt-box" style={{marginTop:12}}>
                        <div className="prompt-lbl" style={{color:actionP.type==='PAUSE'?'#92400e':'#991b1b'}}>
                            {actionP.type==='PAUSE'?'MOTIVO DE PAUSA':'MOTIVO DE ANULACIÓN'} (OBLIGATORIO)
                        </div>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                            <input
                                autoFocus
                                className="prompt-inp"
                                style={{flex:1,minWidth:'160px'}}
                                placeholder="EJ: LLUVIA, FALTA MATERIAL..."
                                value={actionP.reason}
                                onChange={e=>setActionP({...actionP,reason:e.target.value})}
                                onKeyDown={e=>e.key==='Enter'&&submitAction()}
                            />
                            <div style={{display:'flex',gap:6}}>
                                <button onClick={()=>setActionP({id:null,type:null,techs:'',odt:'',reason:''})} className="btn btn-reopen">CANCELAR</button>
                                <button onClick={submitAction} className={`btn ${actionP.type==='PAUSE'?'btn-pause':'btn-cancel'}`}>GUARDAR</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* EDIT prompt */}
                {isBeingEdited && (
                    <div className="prompt-box edit-mode" style={{marginTop:12}}>
                        <div className="prompt-lbl" style={{color:'#6b21a8'}}>EDITAR TÉCNICOS Y ODT</div>
                        <div style={{display:'flex',flexDirection:'column',gap:8}}>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>TÉCNICOS ASIGNADOS</label>
                                <input
                                    className="prompt-inp"
                                    placeholder="TÉCNICOS"
                                    value={editP.techs}
                                    onChange={e=>setEditP({...editP,techs:e.target.value})}
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>NÚMERO ODT</label>
                                <input
                                    className="prompt-inp odt"
                                    placeholder="EJ: ODT-2025-001"
                                    value={editP.odt}
                                    onChange={e=>setEditP({...editP,odt:e.target.value})}
                                    onKeyDown={e=>e.key==='Enter'&&submitEdit()}
                                />
                            </div>
                            <div style={{display:'flex',gap:6}}>
                                <button onClick={()=>setEditP({id:null,techs:'',odt:''})} className="btn btn-reopen">CANCELAR</button>
                                <button onClick={submitEdit} className="btn btn-edit"><EditIco /> GUARDAR CAMBIOS</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ════════════════════════════════════════════
    // LOADING
    // ════════════════════════════════════════════
    if(loading) return (
        <div className="loading-screen">
            <div style={{position:'relative',marginBottom:8}}>
                <div className="load-ring" />
                <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--primary)'}}>
                    <ToolIco c="h-7 w-7" />
                </div>
            </div>
            <div style={{color:'rgba(255,255,255,.8)',fontSize:'.9rem',fontWeight:900,letterSpacing:'.05em'}}>AIRTEK</div>
            <div style={{color:'rgba(255,255,255,.3)',fontSize:'.6rem',fontWeight:800,letterSpacing:'.2em',animation:'pulse-g 2s infinite'}}>CONECTANDO…</div>
        </div>
    );

    // ════════════════════════════════════════════
    // MAIN RENDER
    // ════════════════════════════════════════════
    return (
        <div style={{minHeight:'100vh',paddingBottom:96}}>
            <DayTooltip />

            {/* ── HEADER ── */}
            <header className="app-header" style={{padding:'14px 20px'}}>
                <div style={{maxWidth:740,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <div className="logo-ring"><ToolIco c="h-6 w-6" /></div>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <span className="header-title">Airtek</span>
                                <span className="header-badge">PREVENTIVO</span>
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3}}>
                                <span className={`status-dot ${isCloud?'online':'offline'}`} />
                                <span className={`status-lbl ${isCloud?'online-lbl':'offline-lbl'}`}>{isCloud?'SISTEMA ONLINE':'OFFLINE'}</span>
                            </div>
                        </div>
                    </div>
                    <button onClick={()=>setIsAdmin(!isAdmin)} className={`mode-btn ${isAdmin?'mode-active':'mode-inactive'}`}>
                        {isAdmin ? '✎ EDITOR' : '◉ LECTURA'}
                    </button>
                </div>
            </header>

            <div style={{maxWidth:740,margin:'0 auto',padding:'18px 14px',display:'flex',flexDirection:'column',gap:16}}>

                {/* ── STATS BAR ── */}
                <div className="stats-bar">
                    {[
                        {cls:'stat-pending',   num:stats.pending,   lbl:'PENDIENTES'},
                        {cls:'stat-executing', num:stats.executing, lbl:'EN EJECUCIÓN'},
                        {cls:'stat-overdue',   num:stats.overdue,   lbl:'VENCIDAS'},
                        {cls:'stat-done',      num:stats.done,      lbl:'COMPLETADAS'},
                    ].map(s=>(
                        <div key={s.lbl} className={`stat-card ${s.cls}`}>
                            <div className="stat-num">{s.num}</div>
                            <div className="stat-lbl">{s.lbl}</div>
                        </div>
                    ))}
                </div>

                {/* ── TABS ── */}
                <nav className="tab-nav no-scroll">
                    {[
                        {id:'cronograma',label:'CALENDARIO'},
                        {id:'programar', label:'PROGRAMAR PM'},
                        {id:'historial', label:'HISTORIAL'},
                        {id:'maestro',   label:'ZONAS / NODOS'}
                    ].map(t=>(
                        <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`tab-btn ${activeTab===t.id?'tab-active':'tab-inactive'}`}>{t.label}</button>
                    ))}
                </nav>

                {/* ── CONTENT ── */}
                <main className="tab-content" style={{display:'flex',flexDirection:'column',gap:14}}>

                    {/* ────── CALENDARIO ────── */}
                    {activeTab==='cronograma' && (
                        <>
                            {/* Filter + Today bar */}
                            <div className="filter-bar">
                                <span className="filter-lbl">FILTRAR:</span>
                                <select className="filter-select" value={filterZone} onChange={e=>setFilterZone(e.target.value)}>
                                    <option value="">TODAS LAS ZONAS</option>
                                    {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                </select>
                                <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
                                    <option value="">TODOS LOS ESTADOS</option>
                                    <option value="PENDIENTE">PENDIENTE</option>
                                    <option value="EN EJECUCION">EN EJECUCIÓN</option>
                                    <option value="EN PAUSA">EN PAUSA</option>
                                    <option value="COMPLETADO">COMPLETADO</option>
                                    <option value="ANULADA">ANULADA</option>
                                </select>
                                {(filterZone||filterStatus) && (
                                    <button className="filter-clear" onClick={()=>{setFilterZone('');setFilterStatus('');}}>✕ LIMPIAR</button>
                                )}
                                <button className="today-btn" onClick={goToday} style={{marginLeft:'auto'}}>⊙ HOY</button>
                            </div>

                            <Calendar />

                            {/* Day detail */}
                            <div>
                                <div className="sec-title" style={{marginBottom:12}}>
                                    {selDate ? formatDate(selDate) : 'SELECCIONE UN DÍA'}
                                </div>
                                {daySchedules.length===0 ? (
                                    <div className="card">
                                        <div className="empty">
                                            <div className="empty-ico">
                                                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                                            </div>
                                            <div className="empty-txt">
                                                {filterZone||filterStatus ? 'SIN RESULTADOS CON ESTOS FILTROS' : 'DÍA LIBRE · SIN MANTENIMIENTOS'}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                                        {/* Day summary */}
                                        <div style={{display:'flex',gap:8,flexWrap:'wrap',paddingLeft:2}}>
                                            <span style={{fontSize:'.6rem',fontWeight:800,letterSpacing:'.1em',color:'var(--muted)'}}>
                                                {daySchedules.length}/5 INSPECCIONES AGENDADAS
                                            </span>
                                        </div>
                                        {daySchedules.map(sch=><SchCard key={sch.id} sch={sch} />)}
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {/* ────── PROGRAMAR ────── */}
                    {activeTab==='programar' && (
                        <form onSubmit={handleSaveSchedule} className="card card-xl" style={{padding:'26px',display:'flex',flexDirection:'column',gap:16}}>
                            <div style={{textAlign:'center',paddingBottom:14,borderBottom:'1px solid var(--border)'}}>
                                <div style={{fontSize:'.75rem',fontWeight:900,color:'var(--primary)',letterSpacing:'.08em',marginBottom:4}}>PROGRAMAR MANTENIMIENTO</div>
                                <div style={{fontSize:'.58rem',fontWeight:700,color:'var(--muted)',letterSpacing:'.12em'}}>MÁX 5 NODOS / DÍA · FIN DE SEMANA → LUNES</div>
                            </div>

                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                                <div className="form-group">
                                    <label className="form-lbl">FECHA BASE</label>
                                    <input required type="date" className="form-inp" value={newSch.date} onChange={e=>setNewSch({...newSch,date:e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label className="form-lbl">ZONA</label>
                                    <select required className="form-sel" value={newSch.zoneId} onChange={e=>setNewSch({...newSch,zoneId:e.target.value,selectedNodes:[]})}>
                                        <option value="">ELEGIR ZONA…</option>
                                        {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            {newSch.zoneId && (
                                <div className="node-sel-box">
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                                        <label style={{fontSize:'.6rem',fontWeight:900,letterSpacing:'.12em',color:'var(--primary)'}}>NODOS A INTERVENIR</label>
                                        <span style={{fontSize:'.6rem',fontWeight:800,padding:'3px 10px',borderRadius:999,background:newSch.selectedNodes.length>=5?'#fff7ed':'#f1f5f9',color:newSch.selectedNodes.length>=5?'#c2410c':'#475569',border:`1px solid ${newSch.selectedNodes.length>=5?'#fed7aa':'#e2e8f0'}`}}>
                                            {newSch.selectedNodes.length}/5
                                        </span>
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
                                        {nodesInZone.map(n=>{
                                            const isSel = newSch.selectedNodes.includes(n.id);
                                            const isMax = newSch.selectedNodes.length>=5 && !isSel;
                                            return (
                                                <label key={n.id} className={`node-sel-lbl ${isSel?'nsl-sel':''} ${isMax?'nsl-dis':''}`}>
                                                    <input type="checkbox" className="chk" disabled={isMax} checked={isSel} onChange={()=>toggleNode(n.id)} />
                                                    <span style={{fontSize:'.68rem',fontWeight:800,color:isSel?'var(--primary-d)':'#334155'}}>{n.name}</span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <div className="recur-box">
                                <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                                    <input type="checkbox" className="chk" checked={newSch.recurring} onChange={e=>setNewSch({...newSch,recurring:e.target.checked})} />
                                    <span style={{fontSize:'.68rem',fontWeight:800,color:'#0f766e',letterSpacing:'.08em'}}>PROGRAMAR RECURRENTE (1 AÑO)</span>
                                </label>
                                {newSch.recurring && (
                                    <div className="form-group" style={{marginTop:12}}>
                                        <label className="form-lbl" style={{color:'#0f766e'}}>REPETIR CADA (DÍAS)</label>
                                        <input type="number" className="form-inp" style={{background:'#fff',borderColor:'#a7f3d0'}} value={newSch.repeatDays} min="1" onChange={e=>setNewSch({...newSch,repeatDays:e.target.value})} />
                                        <span style={{fontSize:'.58rem',fontWeight:700,color:'#0f766e',fontStyle:'italic',marginTop:4}}>GENERARÁ CITAS AUTOMÁTICAMENTE POR 1 AÑO.</span>
                                    </div>
                                )}
                            </div>

                            <div style={{fontSize:'.58rem',fontWeight:700,color:'var(--muted)',textAlign:'center',fontStyle:'italic'}}>
                                * TÉCNICOS Y ODT SE ASIGNAN AL INICIAR CADA TAREA EN EL CALENDARIO.
                            </div>

                            <button type="submit" className="btn btn-full">AGENDAR FECHAS</button>
                        </form>
                    )}

                    {/* ────── HISTORIAL ────── */}
                    {activeTab==='historial' && (() => {
                        const completed = schedules.filter(s=>s.status==='COMPLETADO');
                        const filtered  = completed.filter(s => {
                            const nid = s.nodeId || (s.nodes&&s.nodes[0]);
                            if(histFilterZone && s.zoneId !== histFilterZone) return false;
                            if(histFilterNode && nid !== histFilterNode) return false;
                            if(histFilterTech && !(s.techs||'').toUpperCase().includes(histFilterTech.toUpperCase())) return false;
                            return true;
                        }).sort((a,b)=>new Date(b.date)-new Date(a.date));

                        return (
                        <>
                            {/* Header */}
                            <div className="card" style={{padding:'18px 22px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                                <div>
                                    <div style={{fontSize:'.75rem',fontWeight:900,letterSpacing:'.06em'}}>HISTORIAL DE EJECUCIÓN</div>
                                    <div style={{fontSize:'.6rem',fontWeight:700,color:'var(--muted)',marginTop:3,letterSpacing:'.1em'}}>
                                        {filtered.length} DE {completed.length} MANTENIMIENTOS
                                    </div>
                                </div>
                                <button onClick={exportPDF} className="btn btn-dark" style={{gap:7}}><PdfIco /> EXPORTAR PDF</button>
                            </div>

                            {/* Filters */}
                            <div className="filter-bar" style={{flexWrap:'wrap',gap:8}}>
                                <span className="filter-lbl">FILTRAR:</span>
                                <select className="filter-select" value={histFilterZone} onChange={e=>{setHistFilterZone(e.target.value);setHistFilterNode('');}}>
                                    <option value="">TODAS LAS ZONAS</option>
                                    {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                </select>
                                <select className="filter-select" value={histFilterNode} onChange={e=>setHistFilterNode(e.target.value)}>
                                    <option value="">TODOS LOS NODOS</option>
                                    {(histFilterZone ? nodes.filter(n=>n.zoneId===histFilterZone) : nodes)
                                        .map(n=><option key={n.id} value={n.id}>{n.name}</option>)}
                                </select>
                                <input
                                    className="filter-select"
                                    style={{minWidth:140}}
                                    placeholder="TÉCNICO..."
                                    value={histFilterTech}
                                    onChange={e=>setHistFilterTech(e.target.value)}
                                />
                                {(histFilterZone||histFilterNode||histFilterTech) && (
                                    <button className="filter-clear" onClick={()=>{setHistFilterZone('');setHistFilterNode('');setHistFilterTech('');}}>✕ LIMPIAR</button>
                                )}
                            </div>

                            {/* Table */}
                            <div className="card" style={{overflow:'hidden'}}>
                                <div style={{overflowX:'auto'}}>
                                    <table className="hist-tbl">
                                        <thead>
                                            <tr>
                                                <th>FECHA</th>
                                                <th>ODT</th>
                                                <th>ZONA</th>
                                                <th>NODO</th>
                                                <th>TÉCNICOS</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filtered.length===0 ? (
                                                <tr><td colSpan="5" style={{textAlign:'center',padding:40,color:'var(--muted)',fontSize:'.63rem',fontWeight:800,letterSpacing:'.12em'}}>
                                                    {completed.length===0 ? 'AÚN NO HAY MANTENIMIENTOS FINALIZADOS' : 'SIN RESULTADOS CON ESTOS FILTROS'}
                                                </td></tr>
                                            ) : (
                                                filtered.map(s => {
                                                    const nid = s.nodeId || (s.nodes&&s.nodes[0]);
                                                    return (
                                                    <tr key={s.id}>
                                                        <td style={{whiteSpace:'nowrap',fontFamily:"'JetBrains Mono',monospace",fontSize:'.62rem'}}>{formatDate(s.date)}</td>
                                                        <td>{s.odt ? <span className="badge b-odt">{s.odt}</span> : <span style={{color:'var(--muted)'}}>—</span>}</td>
                                                        <td><div className="zone-chip"><span className={`zdot ${getZoneColor(s.zoneId)}`} />{getZoneName(s.zoneId)}</div></td>
                                                        <td><span className="node-tag">{getNodeName(nid)}</span></td>
                                                        <td style={{color:'var(--primary)',fontWeight:800}}>{s.techs||'NO REGISTRADO'}</td>
                                                    </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                        );
                    })()}

                    {/* ────── MAESTRO ────── */}
                    {activeTab==='maestro' && (
                        <>
                            <div className="sub-tab">
                                {['zona','nodo'].map(t=>(
                                    <button key={t} onClick={()=>setAdminSec(t)} className={`sub-btn ${adminSec===t?'sub-active':'sub-inactive'}`}>
                                        {t==='zona'?'ADMINISTRAR ZONAS':'ADMINISTRAR NODOS'}
                                    </button>
                                ))}
                            </div>

                            {adminSec==='zona' && (
                                <>
                                    <form onSubmit={handleAddZone} className="card card-xl" style={{padding:'22px',display:'flex',flexDirection:'column',gap:12}}>
                                        <div style={{fontSize:'.65rem',fontWeight:900,textAlign:'center',letterSpacing:'.08em',borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:2}}>NUEVA ZONA GEOGRÁFICA</div>
                                        <div className="form-group">
                                            <label className="form-lbl">NOMBRE</label>
                                            <input required className="form-inp" placeholder="EJ: SAN FRANCISCO" value={newZone.name} onChange={e=>setNewZone({...newZone,name:e.target.value.toUpperCase()})} />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-lbl">COLOR EN CALENDARIO</label>
                                            <div style={{display:'flex',flexWrap:'wrap',gap:8,paddingTop:4}}>
                                                {ZONE_COLORS.map(c=>(
                                                    <button key={c} type="button" onClick={()=>setNewZone({...newZone,color:c})} className={`color-sw ${c} ${newZone.color===c?'sel':''}`} />
                                                ))}
                                            </div>
                                        </div>
                                        <button type="submit" className="btn btn-dark" style={{width:'100%',padding:'13px',borderRadius:14,marginTop:4}}>+ CREAR ZONA</button>
                                    </form>
                                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                                        <div className="sec-title" style={{marginBottom:4,display:'flex',justifyContent:'space-between'}}>
                                            <span>ZONAS REGISTRADAS ({zones.length})</span>
                                            {isAdmin && <span style={{color:'var(--primary)',fontSize:'.58rem'}}>MODO EDITOR ACTIVO</span>}
                                        </div>
                                        {zones.map(z=>(
                                            <div key={z.id} className="zone-card">
                                                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                                                        <span className={`${z.color||'bg-slate-500'}`} style={{width:14,height:14,borderRadius:'50%',display:'inline-block',flexShrink:0}} />
                                                        <span style={{fontSize:'.75rem',fontWeight:900}}>{z.name}</span>
                                                        <span style={{fontSize:'.58rem',color:'var(--muted)',fontWeight:700}}>{nodes.filter(n=>n.zoneId===z.id).length} NODOS</span>
                                                    </div>
                                                    {isAdmin && <button onClick={()=>deleteItem('pm_zones',z.id,z.name)} className="btn btn-delete"><TrashIco /></button>}
                                                </div>
                                                {isAdmin && (
                                                    <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)',display:'flex',flexWrap:'wrap',gap:6}}>
                                                        {ZONE_COLORS.map(c=>(
                                                            <button key={c} type="button" onClick={()=>handleUpdateZoneColor(z.id,c)} className={`color-sw ${c}`} style={{width:22,height:22,opacity:z.color===c?1:.3}} />
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}

                            {adminSec==='nodo' && (
                                <>
                                    <form onSubmit={handleAddNode} className="card card-xl" style={{padding:'22px',display:'flex',flexDirection:'column',gap:12}}>
                                        <div style={{fontSize:'.65rem',fontWeight:900,textAlign:'center',letterSpacing:'.08em',borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:2}}>AGREGAR NODO A UNA ZONA</div>
                                        <div className="form-group">
                                            <label className="form-lbl">ZONA DESTINO</label>
                                            <select required className="form-sel" value={newNode.zoneId} onChange={e=>setNewNode({...newNode,zoneId:e.target.value})}>
                                                <option value="">SELECCIONAR ZONA…</option>
                                                {zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
                                            </select>
                                        </div>
                                        <div style={{display:'flex',gap:8}}>
                                            <div className="form-group" style={{flex:1}}>
                                                <label className="form-lbl">NOMBRE DEL NODO</label>
                                                <input required className="form-inp" placeholder="NOMBRE DEL NODO" value={newNode.name} onChange={e=>setNewNode({...newNode,name:e.target.value.toUpperCase()})} />
                                            </div>
                                            <div style={{alignSelf:'flex-end'}}>
                                                <button type="submit" className="btn btn-dark" style={{padding:'13px 20px',borderRadius:13}}>+ CREAR</button>
                                            </div>
                                        </div>
                                    </form>
                                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                                        <div className="sec-title" style={{marginBottom:4}}>NODOS POR ZONA</div>
                                        {zones.map(z=>{
                                            const znodes=nodes.filter(n=>n.zoneId===z.id);
                                            if(!znodes.length) return null;
                                            return (
                                                <div key={z.id} className="zone-card">
                                                    <div style={{display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid var(--border)',paddingBottom:10,marginBottom:10}}>
                                                        <span className={`${z.color||'bg-slate-500'}`} style={{width:8,height:8,borderRadius:'50%',display:'inline-block',flexShrink:0}} />
                                                        <span style={{fontSize:'.63rem',fontWeight:900,letterSpacing:'.12em'}}>{z.name}</span>
                                                        <span style={{fontSize:'.58rem',fontWeight:700,color:'var(--muted)',marginLeft:'auto'}}>{znodes.length} NODO{znodes.length!==1?'S':''}</span>
                                                    </div>
                                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
                                                        {znodes.map(n=>(
                                                            <div key={n.id} className="node-item">
                                                                <span className="node-name">{n.name}</span>
                                                                {isAdmin && <button onClick={()=>deleteItem('pm_nodes',n.id,n.name)} style={{color:'#dc2626',background:'none',border:'none',cursor:'pointer',padding:4,lineHeight:0}}><TrashIco /></button>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}
                        </>
                    )}
                </main>
            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
