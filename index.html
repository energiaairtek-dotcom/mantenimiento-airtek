<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airtek · PM Zulia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #eef1f6;
            --surface:   #ffffff;
            --border:    #dde3ed;
            --primary:   #0d9488;
            --primary-d: #0f766e;
            --primary-l: #ccfbf1;
            --accent:    #06b6d4;
            --danger:    #ef4444;
            --warn:      #f59e0b;
            --info:      #3b82f6;
            --dark:      #0d1b2a;
            --dark2:     #162032;
            --text:      #0d1b2a;
            --muted:     #64748b;
            --sh:        0 2px 12px rgba(13,26,42,.07), 0 1px 3px rgba(13,26,42,.05);
            --sh-h:      0 8px 32px rgba(13,148,136,.14), 0 2px 8px rgba(13,26,42,.07);
            --sh-pop:    0 20px 60px rgba(13,26,42,.18), 0 4px 16px rgba(13,26,42,.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse 90% 50% at 50% -5%, rgba(13,148,136,.07) 0%, transparent 55%);
            color: var(--text);
            text-transform: uppercase;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .app-header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
            border-bottom: 1px solid rgba(13,148,136,.3);
            box-shadow: 0 4px 28px rgba(13,26,42,.35);
            position: sticky; top: 0; z-index: 60;
        }
        .logo-ring {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 14px; padding: 10px; color: #fff;
            box-shadow: 0 4px 16px rgba(13,148,136,.4);
        }
        .header-title { font-size: 1.2rem; font-weight: 900; letter-spacing: -.02em; color: #fff; }
        .header-badge { font-size: .58rem; font-weight: 800; background: rgba(13,148,136,.2); color: #5eead4; border: 1px solid rgba(13,148,136,.3); padding: 2px 8px; border-radius: 999px; letter-spacing: .12em; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; }
        .online  { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); animation: pulse-g 2s infinite; }
        .offline { background: #ef4444; }
        .status-lbl { font-size: .6rem; font-weight: 700; letter-spacing: .12em; }
        .online-lbl  { color: #86efac; }
        .offline-lbl { color: #fca5a5; }
        .mode-btn {
            font-size: .6rem; font-weight: 800; letter-spacing: .1em; padding: 6px 14px;
            border-radius: 999px; border: none; cursor: pointer; transition: all .2s;
        }
        .mode-active   { background: linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow: 0 2px 12px rgba(13,148,136,.35); }
        .mode-inactive { background: rgba(255,255,255,.08); color: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.1); }

        /* ── STATS BAR ── */
        .stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 10px; text-align: center; box-shadow: var(--sh); transition: all .2s; cursor: default; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--sh-h); }
        .stat-num { font-size: 1.3rem; font-weight: 900; line-height: 1; }
        .stat-lbl { font-size: .55rem; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin-top: 3px; }
        .stat-pending   .stat-num { color: #f97316; }
        .stat-executing .stat-num { color: var(--info); }
        .stat-overdue   .stat-num { color: var(--danger); }
        .stat-done      .stat-num { color: var(--primary); }

        /* ── FILTER BAR ── */
        .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; box-shadow: var(--sh); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-select { font-family: 'Exo 2',sans-serif; font-size: .62rem; font-weight: 700; text-transform: uppercase; background: #f8fafc; border: 1.5px solid var(--border); border-radius: 10px; padding: 7px 12px; outline: none; color: var(--text); cursor: pointer; transition: border-color .18s; appearance: none; }
        .filter-select:focus { border-color: var(--primary); }
        .filter-lbl { font-size: .58rem; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
        .filter-clear { font-size: .58rem; font-weight: 800; letter-spacing: .1em; padding: 7px 12px; background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; border-radius: 10px; cursor: pointer; transition: all .18s; }
        .filter-clear:hover { background: #fee2e2; }
        .today-btn { font-size: .58rem; font-weight: 800; letter-spacing: .1em; padding: 7px 14px; background: linear-gradient(135deg,var(--primary),var(--primary-d)); color: #fff; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 2px 8px rgba(13,148,136,.3); transition: all .18s; }
        .today-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(13,148,136,.4); }

        /* ── TABS ── */
        .tab-nav { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 5px; display: flex; gap: 4px; box-shadow: var(--sh); overflow-x: auto; }
        .tab-nav::-webkit-scrollbar { display: none; }
        .tab-btn { flex:1; min-width:90px; padding:11px 8px; border-radius:13px; border:none; cursor:pointer; font-family:'Exo 2',sans-serif; font-size:.6rem; font-weight:800; letter-spacing:.1em; white-space:nowrap; transition:all .2s; text-transform:uppercase; }
        .tab-active   { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; box-shadow:0 4px 16px rgba(13,148,136,.3); }
        .tab-inactive { background:transparent; color:var(--muted); }
        .tab-inactive:hover { background:#f0fdf9; color:var(--primary); }

        /* ── CARD ── */
        .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; box-shadow:var(--sh); }
        .card-xl { border-radius:28px; }
        .card:hover { box-shadow:var(--sh-h); }

        /* ── CALENDAR ── */
        .cal-hdr { font-size:.68rem; font-weight:900; letter-spacing:.15em; color:var(--text); }
        .cal-day-lbl { font-size:.58rem; font-weight:800; letter-spacing:.1em; color:var(--muted); text-align:center; padding:4px 0; }
        .cal-cell {
            min-height:72px; padding:7px 5px 5px; border-radius:14px;
            border:2px solid transparent; cursor:pointer;
            transition:all .18s cubic-bezier(.4,0,.2,1);
            display:flex; flex-direction:column; align-items:center;
            background:#f8fafc; position:relative;
        }
        .cal-cell:hover  { border-color:#99f6e4; background:#f0fdf9; transform:translateY(-1px); }
        .cal-cell.cal-active { border-color:var(--primary); background:linear-gradient(135deg,#f0fdf9,#e0f7f4); box-shadow:0 4px 18px rgba(13,148,136,.18); transform:scale(1.04); z-index:2; }
        .cal-num { font-size:.7rem; font-weight:900; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:3px; flex-shrink:0; }
        .cal-num-today    { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow:0 2px 8px rgba(13,148,136,.4); }
        .cal-num-selected { color:var(--primary-d); font-weight:900; }
        .cal-num-normal   { color:#475569; }
        .cal-dots { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; margin-top:auto; }
        .cal-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

        /* Overdue badge on cell */
        .cell-overdue-dot { position:absolute; top:4px; right:4px; width:7px; height:7px; background:#ef4444; border-radius:50%; box-shadow:0 0 0 2px rgba(239,68,68,.25); animation:pulse-r 2s infinite; }

        /* ── HOVER TOOLTIP ── */
        .day-tooltip {
            position:fixed; z-index:200; pointer-events:none;
            background:var(--dark); color:#fff;
            border:1px solid rgba(255,255,255,.12);
            border-radius:16px; padding:14px 16px;
            min-width:220px; max-width:300px;
            box-shadow:var(--sh-pop);
            animation:tooltipIn .15s cubic-bezier(.16,1,.3,1);
        }
        @keyframes tooltipIn { from{opacity:0;transform:scale(.95) translateY(4px)} to{opacity:1;transform:scale(1) translateY(0)} }
        .tt-date { font-size:.58rem; font-weight:800; letter-spacing:.15em; color:rgba(255,255,255,.4); margin-bottom:8px; }
        .tt-row { display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid rgba(255,255,255,.07); }
        .tt-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px; }
        .tt-node { font-size:.65rem; font-weight:700; color:#e2e8f0; line-height:1.4; }
        .tt-status { font-size:.55rem; font-weight:800; letter-spacing:.08em; }
        .tt-delay { font-size:.55rem; font-weight:800; color:#fca5a5; background:rgba(239,68,68,.2); padding:2px 7px; border-radius:999px; margin-top:3px; display:inline-block; }
        .tt-cap { font-size:.58rem; font-weight:700; color:rgba(255,255,255,.4); margin-top:8px; padding-top:7px; border-top:1px solid rgba(255,255,255,.07); }

        /* Status colors in tooltip */
        .tt-pending   { color:#fdba74; }
        .tt-executing { color:#93c5fd; }
        .tt-paused    { color:#fcd34d; }
        .tt-completed { color:#6ee7b7; }
        .tt-cancelled { color:#fca5a5; }
        .tt-overdue   { color:#f87171; }

        /* ── SCHEDULE CARDS ── */
        .sch-card {
            background:var(--surface); border:1px solid var(--border); border-left-width:4px;
            border-radius:20px; padding:18px 20px; transition:all .2s; box-shadow:var(--sh);
        }
        .sch-card:hover { box-shadow:var(--sh-h); transform:translateY(-1px); }
        .s-executing { border-left-color:var(--info); animation:bpulse 2.5s infinite; }
        .s-completed { border-left-color:var(--primary); opacity:.85; }
        .s-paused    { border-left-color:var(--warn); }
        .s-cancelled { border-left-color:var(--danger); opacity:.75; }
        .s-pending   { border-left-color:#f97316; }
        .s-overdue   { border-left-color:#dc2626; }
        @keyframes bpulse { 0%,100%{box-shadow:var(--sh)} 50%{box-shadow:0 0 0 4px rgba(59,130,246,.12),var(--sh)} }

        /* ── BADGES ── */
        .badge { font-size:.57rem; font-weight:800; letter-spacing:.1em; padding:3px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
        .b-pending   { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
        .b-executing { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
        .b-paused    { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
        .b-completed { background:#f0fdf9; color:#065f46; border:1px solid #a7f3d0; }
        .b-cancelled { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .b-overdue   { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .b-delay     { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; font-size:.57rem; font-weight:900; }
        .b-recurring { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
        .b-odt       { background:#faf5ff; color:#6b21a8; border:1px solid #e9d5ff; font-family:'JetBrains Mono',monospace; }

        /* ── ZONE CHIP ── */
        .zone-chip { display:inline-flex; align-items:center; gap:7px; background:#f8fafc; border:1px solid var(--border); padding:4px 10px; border-radius:8px; font-size:.62rem; font-weight:800; letter-spacing:.08em; color:#334155; }
        .zdot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

        /* ── NODE TAGS ── */
        .node-tag { font-family:'JetBrains Mono',monospace; font-size:.62rem; font-weight:600; background:#f8fafc; border:1px solid var(--border); padding:4px 10px; border-radius:7px; color:#334155; }
        .node-box { background:linear-gradient(135deg,#f8fafc,#f0f7ff); border:1px solid var(--border); border-radius:14px; padding:13px; }
        .node-box-lbl { font-size:.56rem; font-weight:800; letter-spacing:.15em; color:var(--primary); margin-bottom:7px; }

        /* ── BUTTONS ── */
        .btn { font-family:'Exo 2',sans-serif; text-transform:uppercase; font-size:.62rem; font-weight:800; letter-spacing:.1em; padding:9px 16px; border-radius:10px; border:none; cursor:pointer; transition:all .18s; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:5px; }
        .btn-start    { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; box-shadow:0 3px 12px rgba(13,148,136,.3); }
        .btn-start:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(13,148,136,.4); }
        .btn-complete { background:linear-gradient(135deg,var(--info),#2563eb); color:#fff; box-shadow:0 3px 12px rgba(59,130,246,.3); }
        .btn-complete:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(59,130,246,.4); }
        .btn-pause  { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
        .btn-pause:hover { background:#fef3c7; }
        .btn-cancel { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .btn-cancel:hover { background:#fee2e2; }
        .btn-reopen { background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; }
        .btn-reopen:hover { background:#e2e8f0; }
        .btn-delete { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; padding:9px; }
        .btn-delete:hover { background:#fee2e2; }
        .btn-edit   { background:#faf5ff; color:#6b21a8; border:1px solid #e9d5ff; }
        .btn-edit:hover { background:#f3e8ff; }
        .btn-resume { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow:0 3px 12px rgba(13,148,136,.3); }
        .btn-dark   { background:linear-gradient(135deg,var(--dark),var(--dark2)); color:#fff; box-shadow:0 4px 16px rgba(13,26,42,.3); }
        .btn-dark:hover { box-shadow:0 6px 20px rgba(13,26,42,.4); transform:translateY(-1px); }
        .btn-full   { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#fff; padding:17px; border-radius:16px; width:100%; font-size:.7rem; letter-spacing:.15em; box-shadow:0 6px 24px rgba(13,148,136,.35); }
        .btn-full:hover { box-shadow:0 10px 36px rgba(13,148,136,.45); transform:translateY(-2px); }

        /* ── FORMS ── */
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-lbl { font-size:.59rem; font-weight:800; letter-spacing:.15em; color:var(--muted); padding-left:3px; }
        .form-inp, .form-sel {
            font-family:'Exo 2',sans-serif; text-transform:uppercase; font-size:.72rem; font-weight:700;
            width:100%; padding:13px 15px; background:#f8fafc; border:2px solid var(--border);
            border-radius:13px; outline:none; color:var(--text); transition:all .18s; appearance:none;
        }
        .form-inp:focus,.form-sel:focus { border-color:var(--primary); background:#fff; box-shadow:0 0 0 4px rgba(13,148,136,.1); }

        /* Custom checkbox */
        .chk { appearance:none; background:#f8fafc; width:20px; height:20px; border:2px solid #cbd5e1; border-radius:6px; display:grid; place-content:center; transition:all .2s; cursor:pointer; flex-shrink:0; }
        .chk::before { content:""; width:.7em; height:.7em; transform:scale(0); transition:120ms transform ease-in-out; box-shadow:inset 1em 1em white; clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%); }
        .chk:checked { background:var(--primary); border-color:var(--primary); }
        .chk:checked::before { transform:scale(1); }
        .chk:disabled { opacity:.4; cursor:not-allowed; }

        /* ── ACTION/EDIT PROMPT ── */
        .prompt-box { background:linear-gradient(135deg,#f8fafc,#f0fdf9); border:1px solid var(--border); border-radius:16px; padding:16px; animation:slideD .2s cubic-bezier(.16,1,.3,1); }
        .prompt-box.edit-mode { background:linear-gradient(135deg,#faf5ff,#f3e8ff); border-color:#e9d5ff; }
        @keyframes slideD { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
        .prompt-lbl { font-size:.58rem; font-weight:800; letter-spacing:.15em; margin-bottom:10px; }
        .prompt-inp { font-family:'Exo 2',sans-serif; text-transform:uppercase; font-size:.72rem; font-weight:700; flex:1; padding:11px 13px; background:#fff; border:2px solid var(--border); border-radius:11px; outline:none; color:var(--text); transition:border-color .18s; }
        .prompt-inp:focus { border-color:var(--primary); }
        .prompt-inp.odt { border-color:#e9d5ff; }
        .prompt-inp.odt:focus { border-color:#a855f7; box-shadow:0 0 0 3px rgba(168,85,247,.1); }

        /* Reason/tech chips */
        .reason-box { font-size:.62rem; font-weight:700; padding:8px 12px; border-radius:10px; }
        .reason-cancelled { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .reason-paused    { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
        .tech-chip { display:inline-flex; align-items:center; gap:6px; background:#f0fdf9; border:1px solid #a7f3d0; padding:5px 12px; border-radius:8px; font-size:.62rem; font-weight:800; color:#065f46; }

        /* ── SECTION TITLE ── */
        .sec-title { font-size:.6rem; font-weight:900; letter-spacing:.2em; color:var(--muted); padding-left:10px; border-left:3px solid var(--primary); }

        /* ── HISTORY TABLE ── */
        .hist-tbl { width:100%; border-collapse:collapse; }
        .hist-tbl th { font-size:.57rem; font-weight:900; letter-spacing:.15em; color:var(--muted); padding:13px 15px; background:#f8fafc; border-bottom:1px solid var(--border); text-align:left; }
        .hist-tbl td { padding:13px 15px; border-bottom:1px solid #f1f5f9; font-size:.7rem; font-weight:700; vertical-align:middle; }
        .hist-tbl tr:last-child td { border-bottom:none; }
        .hist-tbl tr:hover td { background:#f8fafc; }

        /* ── ZONE ADMIN ── */
        .zone-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:17px; box-shadow:var(--sh); transition:all .2s; }
        .zone-card:hover { box-shadow:var(--sh-h); }
        .node-item { display:flex; align-items:center; justify-content:space-between; padding:9px 13px; background:#f8fafc; border-radius:10px; border:1px solid transparent; transition:all .18s; }
        .node-item:hover { background:#f0fdf9; border-color:#a7f3d0; }
        .node-name { font-family:'JetBrains Mono',monospace; font-size:.65rem; font-weight:600; color:#334155; }
        .sub-tab { background:#f1f5f9; padding:4px; border-radius:14px; display:flex; gap:4px; }
        .sub-btn { flex:1; padding:10px; border-radius:10px; border:none; cursor:pointer; font-family:'Exo 2',sans-serif; font-size:.6rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; transition:all .2s; }
        .sub-active   { background:#fff; color:var(--text); box-shadow:0 1px 6px rgba(13,26,42,.1); }
        .sub-inactive { background:transparent; color:var(--muted); }
        .color-sw { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .18s; }
        .color-sw.sel { border-color:var(--dark); box-shadow:0 0 0 3px rgba(13,26,42,.12); transform:scale(1.15); }
        .color-sw:hover:not(.sel) { transform:scale(1.1); }

        /* ── DELETE OVERLAY ── */
        .del-overlay { position:absolute; inset:0; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); z-index:20; border-radius:28px; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn .2s; }
        .del-modal { background:#fff; border:2px solid #fecaca; border-radius:24px; padding:26px; max-width:300px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(220,38,38,.12); }

        /* ── LOADING ── */
        .loading-screen { position:fixed; inset:0; background:var(--dark); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:100; }
        .load-ring { width:60px; height:60px; border:3px solid rgba(13,148,136,.2); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* ── EMPTY STATE ── */
        .empty { padding:40px 20px; text-align:center; }
        .empty-ico { width:46px; height:46px; background:#f1f5f9; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }

        @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
        @keyframes pulse-g { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)} 50%{box-shadow:0 0 0 6px rgba(34,197,94,0)} }
        @keyframes pulse-r { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)} 50%{box-shadow:0 0 0 5px rgba(239,68,68,0)} }
        .no-scroll::-webkit-scrollbar { display:none; }
        .no-scroll { -ms-overflow-style:none; scrollbar-width:none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter:opacity(.4); cursor:pointer; }

        .node-sel-box { background:#f8fafc; border:1px solid var(--border); border-radius:18px; padding:16px; }
        .node-sel-lbl { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:11px 13px; cursor:pointer; display:flex; align-items:center; gap:9px; transition:all .18s; }
        .node-sel-lbl:hover { border-color:#a7f3d0; background:#f0fdf9; }
        .node-sel-lbl.nsl-sel { border-color:var(--primary); background:#f0fdf9; box-shadow:0 2px 8px rgba(13,148,136,.12); }
        .node-sel-lbl.nsl-dis { opacity:.4; cursor:not-allowed; }
        @media(max-width:640px){ .cal-cell{min-height:60px;padding:5px 3px 4px} .stats-bar{grid-template-columns:repeat(2,1fr)} }
    </style>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const ZONE_COLORS  = ['bg-red-500','bg-blue-500','bg-green-500','bg-yellow-400','bg-purple-500','bg-pink-500','bg-indigo-500','bg-orange-500','bg-teal-500','bg-cyan-500'];
const MONTH_NAMES  = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const TODAY_STR    = new Date().toISOString().split('T')[0];

// ── Tipos de actividad ──
const ACTIVITY_TYPES = [
    { id:'planificada',    label:'PLANIFICADA',      color:'#22c55e', bg:'rgba(34,197,94,.13)',  border:'rgba(34,197,94,.35)'  },
    { id:'no_planificada', label:'NO PLANIFICADA',   color:'#eab308', bg:'rgba(234,179,8,.13)',  border:'rgba(234,179,8,.35)'  },
    { id:'eventualidad',   label:'EVENTUALIDAD',     color:'#ef4444', bg:'rgba(239,68,68,.13)',  border:'rgba(239,68,68,.35)'  },
    { id:'correctivo',     label:'MANT. CORRECTIVO', color:'#f97316', bg:'rgba(249,115,22,.13)', border:'rgba(249,115,22,.35)' },
];
const COORDINACIONES = ['PROYECTOS','OPERACIONES','GRUPOS ELECTRÓGENOS','PERSONAL FORÁNEO'];
const getActType = (id) => ACTIVITY_TYPES.find(t=>t.id===id) || ACTIVITY_TYPES[0];

// ── CSS class for zone color → actual hex (for tooltip dots) ──
const COLOR_HEX = {
    'bg-red-500':'#ef4444','bg-blue-500':'#3b82f6','bg-green-500':'#22c55e',
    'bg-yellow-400':'#facc15','bg-purple-500':'#a855f7','bg-pink-500':'#ec4899',
    'bg-indigo-500':'#6366f1','bg-orange-500':'#f97316','bg-teal-500':'#14b8a6','bg-cyan-500':'#06b6d4'
};

// ── Icons ──
const ToolIco   = ({c="h-6 w-6"}) => <svg viewBox="0 0 24 24" fill="none" className={c}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" fill="currentColor"/></svg>;
const ChevL     = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;
const ChevR     = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
const PdfIco    = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>;
const TrashIco  = () => <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
const UserIco   = () => <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>;
const RepeatIco = () => <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>;
const PlayIco   = () => <svg width="10" height="10" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
const CheckIco  = () => <svg width="10" height="10" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>;
const PauseIco  = () => <svg width="10" height="10" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
const BanIco    = () => <svg width="10" height="10" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>;
const EditIco   = () => <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>;
const OdtIco    = () => <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="4" rx="1" ry="1"/><path strokeLinecap="round" strokeLinejoin="round" d="M9 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2h-3"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>;
const ClockIco  = () => <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

// ── Helpers ──
const todayMidnight = () => new Date(new Date().setHours(0,0,0,0));
const calcDelay = (dateStr, status) => {
    if (status !== 'PENDIENTE' && status !== 'EN PAUSA') return 0;
    const schDate = new Date(dateStr + 'T00:00:00Z');
    const diff = Math.floor((todayMidnight() - schDate) / 86400000);
    return diff > 0 ? diff : 0;
};
const statusClass = (s, isPast) => s==='COMPLETADO'?'s-completed':s==='EN EJECUCION'?'s-executing':s==='EN PAUSA'?'s-paused':s==='ANULADA'?'s-cancelled':isPast?'s-overdue':'s-pending';
const badgeClass  = (s, isPast) => s==='COMPLETADO'?'b-completed':s==='EN EJECUCION'?'b-executing':s==='EN PAUSA'?'b-paused':s==='ANULADA'?'b-cancelled':isPast?'b-overdue':'b-pending';
const statusLabel = (s, isPast, delay) => {
    if(s==='COMPLETADO') return '✓ COMPLETADO';
    if(s==='EN EJECUCION') return '● EN EJECUCIÓN';
    if(s==='EN PAUSA') return `⏸ EN PAUSA${delay>0?' · '+delay+'D':''}`;
    if(s==='ANULADA') return '✕ ANULADA';
    if(isPast) return `⚠ VENCIDA · ${delay}D`;
    return '○ PENDIENTE';
};
const ttStatusClass = (s,isPast) => s==='COMPLETADO'?'tt-completed':s==='EN EJECUCION'?'tt-executing':s==='EN PAUSA'?'tt-paused':s==='ANULADA'?'tt-cancelled':isPast?'tt-overdue':'tt-pending';

// ════════════════════════════════════════════
// SCHEDULE CARD — top-level component (outside App)
// Form inputs use LOCAL state so typing never
// causes App to re-render and lose focus.
// ════════════════════════════════════════════
const SchCard = ({ sch, helpers }) => {
    const { getZoneName, getZoneColor, getNodeName,
            activeAction, activeEdit,
            onStart, onPauseCancel, onEdit,
            onCancelAction, onCancelEdit,
            onStatusChange, onDelete, onReschedule, isAdmin } = helpers;

    // Local form state — completely isolated from App
    const [localTechs,   setLocalTechs]   = React.useState('');
    const [localOdt,     setLocalOdt]     = React.useState('');
    const [localOdtLink, setLocalOdtLink] = React.useState('');
    const [localReason,  setLocalReason]  = React.useState('');

    const isCompleted = sch.status==='COMPLETADO';
    const isExecuting = sch.status==='EN EJECUCION';
    const isPaused    = sch.status==='EN PAUSA';
    const isCancelled = sch.status==='ANULADA';
    const isPending   = sch.status==='PENDIENTE';
    const schDate     = new Date(sch.date+'T00:00:00Z');
    const isPast      = schDate < todayMidnight() && isPending;
    const delay       = calcDelay(sch.date, sch.status);
    const zColor      = getZoneColor(sch.zoneId);
    const sCls        = statusClass(sch.status, isPast);
    const bCls        = badgeClass(sch.status, isPast);
    const sLbl        = statusLabel(sch.status, isPast, delay);
    const nid         = sch.nodeId || (sch.nodes && sch.nodes[0]);

    const showStart  = activeAction === sch.id + ':START';
    const showPause  = activeAction === sch.id + ':PAUSE';
    const showCancel = activeAction === sch.id + ':CANCEL';
    const showEdit   = activeEdit   === sch.id;
    const showBtns   = !showStart && !showPause && !showCancel && !showEdit;
    const canEdit    = isExecuting || isPaused || isCompleted;
    const isOverdue  = isPast; // alias for clarity

    const handleOpenStart  = () => { setLocalTechs(sch.techs||''); setLocalOdt(sch.odt||''); setLocalOdtLink(sch.odtLink||''); onStart(sch.id); };
    const handleOpenPause  = () => { setLocalReason(''); onPauseCancel(sch.id, 'PAUSE'); };
    const handleOpenCancel = () => { setLocalReason(''); onPauseCancel(sch.id, 'CANCEL'); };
    const handleOpenEdit   = () => { setLocalTechs(sch.techs||''); setLocalOdt(sch.odt||''); setLocalOdtLink(sch.odtLink||''); onEdit(sch.id); };

    return (
        <div className={`sch-card ${sCls}`}>
            {/* Activity name + type + coordinacion */}
            {(() => {
                const actT   = getActType(sch.activityType||'planificada');
                const actNm  = sch.activityName || 'INSPECCIÓN PM';
                const coord  = sch.coordinacion || 'OPERACIONES';
                return (
                    <div style={{marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
                        <div style={{fontSize:'.78rem',fontWeight:900,letterSpacing:'.04em',marginBottom:6,color:'var(--text)'}}>{actNm}</div>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                            <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'.58rem',fontWeight:800,letterSpacing:'.08em',padding:'3px 9px',borderRadius:999,background:actT.bg,color:actT.color,border:`1px solid ${actT.border}`}}>
                                <span style={{width:6,height:6,borderRadius:'50%',background:actT.color,flexShrink:0}} />{actT.label}
                            </span>
                            <span style={{fontSize:'.58rem',fontWeight:800,letterSpacing:'.08em',padding:'3px 9px',borderRadius:999,background:'rgba(100,116,139,.1)',color:'var(--muted)',border:'1px solid rgba(100,116,139,.2)'}}>
                                {coord}
                            </span>
                        </div>
                    </div>
                );
            })()}
            {/* Badges */}
            <div style={{display:'flex',flexWrap:'wrap',gap:7,alignItems:'center',marginBottom:12}}>
                <span className={`badge ${bCls}`}>{sLbl}</span>
                {delay > 0 && <span className="badge b-delay"><ClockIco /> {delay}D RETRASO</span>}
                <div className="zone-chip">
                    <span className={`zdot ${isCancelled?'bg-red-200':zColor}`} />
                    <span style={isCancelled?{textDecoration:'line-through',opacity:.5}:{}}>{getZoneName(sch.zoneId)}</span>
                </div>
                {sch.odt && <span className="badge b-odt"><OdtIco /> ODT: {sch.odt}</span>}
                {sch.isRecurring && <span className="badge b-recurring"><RepeatIco /> CADA {sch.repeatDays}D</span>}
            </div>

            {/* Node / Zone */}
            <div className={`node-box${isCancelled?' opacity-50':''}`} style={{marginBottom:10}}>
                <div className="node-box-lbl">{sch.scope==='zone'?'ZONA A INTERVENIR':'NODO A INTERVENIR'}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                    {sch.scope==='zone'
                        ? <span className="node-tag" style={{background:'rgba(13,148,136,.1)',color:'var(--primary)',borderColor:'var(--primary-l)'}}>ZONA COMPLETA: {getZoneName(sch.zoneId)}</span>
                        : nid ? <span className="node-tag">{getNodeName(nid)}</span> : null
                    }
                </div>
            </div>

            {/* Reason */}
            {sch.reason && (
                <div className={`reason-box ${isCancelled?'reason-cancelled':'reason-paused'}`} style={{marginBottom:10}}>
                    MOTIVO: {sch.reason}
                </div>
            )}

            {/* Techs */}
            {sch.techs && !isCancelled && (
                <div className="tech-chip" style={{marginBottom:8}}>
                    <UserIco /> TÉCNICOS: <strong>{sch.techs}</strong>
                </div>
            )}
            {/* ODT Link */}
            {sch.odtLink && !isCancelled && (
                <div style={{marginBottom:10}}>
                    <a href={sch.odtLink} target="_blank" rel="noopener noreferrer"
                        style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:'.6rem',fontWeight:800,color:'#7c3aed',background:'rgba(168,85,247,.1)',border:'1px solid rgba(168,85,247,.3)',padding:'5px 12px',borderRadius:8,textDecoration:'none',letterSpacing:'.06em'}}
                        onClick={e=>e.stopPropagation()}>
                        <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        ABRIR ODT EN SISTEMA
                    </a>
                </div>
            )}

            {/* Action buttons */}
            {showBtns && (
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
                    {isPending && <>
                        <button onClick={handleOpenStart}  className="btn btn-start"><PlayIco /> INICIAR</button>
                        <button onClick={handleOpenPause}  className="btn btn-pause"><PauseIco /> PAUSAR</button>
                        <button onClick={handleOpenCancel} className="btn btn-cancel"><BanIco /> ANULAR</button>
                        <button onClick={()=>onReschedule(sch)} className="btn btn-reopen" style={{background:'rgba(245,158,11,.1)',color:'#92400e',borderColor:'rgba(245,158,11,.35)'}}>
                            📅 REPROGRAMAR
                        </button>
                    </>}
                    {isExecuting && <>
                        <button onClick={()=>onStatusChange(sch,'COMPLETADO')} className="btn btn-complete"><CheckIco /> COMPLETAR</button>
                        <button onClick={handleOpenPause}  className="btn btn-pause"><PauseIco /> PAUSAR</button>
                        <button onClick={handleOpenCancel} className="btn btn-cancel"><BanIco /> ANULAR</button>
                    </>}
                    {isPaused && <>
                        <button onClick={()=>onStatusChange(sch,'EN EJECUCION')} className="btn btn-resume"><PlayIco /> REANUDAR</button>
                        <button onClick={handleOpenCancel} className="btn btn-cancel"><BanIco /> ANULAR</button>
                        <button onClick={()=>onReschedule(sch)} className="btn btn-reopen" style={{background:'rgba(245,158,11,.1)',color:'#92400e',borderColor:'rgba(245,158,11,.35)'}}>
                            📅 REPROGRAMAR
                        </button>
                    </>}
                    {(isCancelled||isCompleted) && (
                        <button onClick={()=>onStatusChange(sch,'PENDIENTE')} className="btn btn-reopen">↺ REABRIR</button>
                    )}
                    {canEdit && (
                        <button onClick={handleOpenEdit} className="btn btn-edit"><EditIco /> EDITAR INFO</button>
                    )}
                    {isAdmin && (
                        <button onClick={()=>onDelete(sch)} className="btn btn-delete" style={{marginLeft:'auto'}}><TrashIco /></button>
                    )}
                </div>
            )}

            {/* START prompt */}
            {showStart && (
                <div className="prompt-box" style={{marginTop:12}}>
                    <div className="prompt-lbl" style={{color:'var(--primary)'}}>ASIGNAR TÉCNICOS Y ORDEN DE TRABAJO</div>
                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                        <div className="form-group">
                            <label className="form-lbl" style={{color:'var(--primary)'}}>TÉCNICOS ASIGNADOS</label>
                            <input className="prompt-inp" placeholder="EJ: L. RAMOS, D. CHACÍN"
                                value={localTechs} onChange={e=>setLocalTechs(e.target.value)} />
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>Nº ODT (OPCIONAL)</label>
                                <input className="prompt-inp odt" placeholder="ODT-2025-001"
                                    value={localOdt} onChange={e=>setLocalOdt(e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>LINK ODT (OPCIONAL)</label>
                                <input className="prompt-inp odt" placeholder="https://..."
                                    style={{textTransform:'none'}}
                                    value={localOdtLink} onChange={e=>setLocalOdtLink(e.target.value)}
                                    onKeyDown={e=>e.key==='Enter'&&onStart(sch.id,'submit',{techs:localTechs,odt:localOdt,odtLink:localOdtLink})} />
                            </div>
                        </div>
                        <div style={{display:'flex',gap:6}}>
                            <button onClick={onCancelAction} className="btn btn-reopen">CANCELAR</button>
                            <button onClick={()=>onStart(sch.id,'submit',{techs:localTechs,odt:localOdt,odtLink:localOdtLink})} className="btn btn-start">GUARDAR E INICIAR</button>
                        </div>
                    </div>
                </div>
            )}

            {/* PAUSE / CANCEL prompt */}
            {(showPause||showCancel) && (
                <div className="prompt-box" style={{marginTop:12}}>
                    <div className="prompt-lbl" style={{color:showPause?'#92400e':'#991b1b'}}>
                        {showPause?'MOTIVO DE PAUSA':'MOTIVO DE ANULACIÓN'} (OBLIGATORIO)
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                        <input autoFocus className="prompt-inp" placeholder="EJ: LLUVIA, FALTA MATERIAL..."
                            value={localReason} onChange={e=>setLocalReason(e.target.value)}
                            onKeyDown={e=>e.key==='Enter'&&onPauseCancel(sch.id,showPause?'PAUSE':'CANCEL','submit',{reason:localReason})} />
                        <div style={{display:'flex',gap:6}}>
                            <button onClick={onCancelAction} className="btn btn-reopen">CANCELAR</button>
                            <button onClick={()=>onPauseCancel(sch.id,showPause?'PAUSE':'CANCEL','submit',{reason:localReason})}
                                className={`btn ${showPause?'btn-pause':'btn-cancel'}`}>GUARDAR</button>
                        </div>
                    </div>
                </div>
            )}

            {/* EDIT prompt */}
            {showEdit && (
                <div className="prompt-box edit-mode" style={{marginTop:12}}>
                    <div className="prompt-lbl" style={{color:'#6b21a8'}}>EDITAR TÉCNICOS Y ODT</div>
                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                        <div className="form-group">
                            <label className="form-lbl" style={{color:'#7c3aed'}}>TÉCNICOS ASIGNADOS</label>
                            <input className="prompt-inp" placeholder="EJ: L. RAMOS, D. CHACÍN"
                                value={localTechs} onChange={e=>setLocalTechs(e.target.value)} />
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>Nº ODT</label>
                                <input className="prompt-inp odt" placeholder="ODT-2025-001"
                                    value={localOdt} onChange={e=>setLocalOdt(e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label className="form-lbl" style={{color:'#7c3aed'}}>LINK ODT</label>
                                <input className="prompt-inp odt" placeholder="https://..."
                                    style={{textTransform:'none'}}
                                    value={localOdtLink} onChange={e=>setLocalOdtLink(e.target.value)}
                                    onKeyDown={e=>e.key==='Enter'&&onEdit(sch.id,'submit',{techs:localTechs,odt:localOdt,odtLink:localOdtLink})} />
                            </div>
                        </div>
                        <div style={{display:'flex',gap:6}}>
                            <button onClick={onCancelEdit} className="btn btn-reopen">CANCELAR</button>
                            <button onClick={()=>onEdit(sch.id,'submit',{techs:localTechs,odt:localOdt,odtLink:localOdtLink})} className="btn btn-edit"><EditIco /> GUARDAR CAMBIOS</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

// ════════════════════════════════════════════
const App = () => {
    const [user,setUser]           = useState(null);
    const [loading,setLoading]     = useState(true);
    const [isCloud,setIsCloud]     = useState(false);
    const [activeTab,setActiveTab] = useState('cronograma');
    const [adminSec,setAdminSec]   = useState('zona');
    const [isAdmin,setIsAdmin]     = useState(false);

    const [zones,setZones]         = useState([]);
    const [nodes,setNodes]         = useState([]);
    const [schedules,setSchedules] = useState([]);

    const [newZone,setNewZone]     = useState({ name:'', color:ZONE_COLORS[0] });
    const [newNode,setNewNode]     = useState({ name:'', zoneId:'' });
    const [newSch,setNewSch]       = useState({ date:'', zoneId:'', selectedNodes:[], recurring:false, repeatDays:30, scheduleMode:'node', activityName:'', activityType:'planificada', coordinacion:'OPERACIONES' });

    // Reschedule modal
    const [reschedule, setReschedule] = useState({ open:false, sch:null, newDate:'' });
    // Upcoming warning config (days before expiry to show alert)
    const [warnDays, setWarnDays]     = useState(3);
    const [showWarnCfg, setShowWarnCfg] = useState(false);

    // delete confirm
    const [delP,setDelP]           = useState({ isOpen:false, schedule:null });

    // History date filters
    const [histFilterDateFrom, setHistFilterDateFrom] = useState('');
    const [histFilterDateTo,   setHistFilterDateTo]   = useState('');

    // Calendar state
    const [curMonth,setCurMonth]   = useState(new Date());
    const [selDate,setSelDate]     = useState(TODAY_STR);

    // Hover tooltip (DOM-driven via tooltipRef — no React state needed)

    // Filters - calendar
    const [filterZone,setFilterZone]     = useState('');
    const [filterStatus,setFilterStatus] = useState('');
    const [filterCoord,setFilterCoord]   = useState('');
    // Filters - history
    const [histFilterZone,setHistFilterZone]   = useState('');
    const [histFilterNode,setHistFilterNode]   = useState('');
    const [histFilterTech,setHistFilterTech]   = useState('');
    const [histFilterCoord,setHistFilterCoord] = useState('');
    const [histFilterType,setHistFilterType]   = useState('');

    const dbRef = useRef(null);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-pm-app-id';

    // ── Firebase init ──
    useEffect(() => {
        const init = async () => {
            if (!window.FirebaseSDK) return;
            const { initializeApp, getAuth, getFirestore, signInAnonymously, onAuthStateChanged, signInWithCustomToken } = window.FirebaseSDK;
            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : window.__firebase_config_manual;
                const app = initializeApp(JSON.parse(configStr));
                dbRef.current = getFirestore(app);
                const auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                const unsub = onAuthStateChanged(auth, u => { if(u){setUser(u);setIsCloud(true);} setLoading(false); });
                return unsub;
            } catch(e) { setLoading(false); }
        };
        window.addEventListener('firebase-ready', init);
        if (window.FirebaseSDK) init();
        return () => window.removeEventListener('firebase-ready', init);
    }, []);

    // ── Firestore listeners ──
    useEffect(() => {
        if (!user || !dbRef.current) return;
        const { collection, onSnapshot } = window.FirebaseSDK;
        const base = ['artifacts', appId, 'public', 'data'];
        const unZ = onSnapshot(collection(dbRef.current, ...base, 'pm_zones'),     s => setZones(s.docs.map(d=>({...d.data(),id:d.id}))), e=>console.error(e));
        const unN = onSnapshot(collection(dbRef.current, ...base, 'pm_nodes'),     s => setNodes(s.docs.map(d=>({...d.data(),id:d.id}))), e=>console.error(e));
        const unS = onSnapshot(collection(dbRef.current, ...base, 'pm_schedules'), s => {
            const data = s.docs.map(d=>({...d.data(),id:d.id}));
            data.sort((a,b)=>new Date(a.date)-new Date(b.date));
            setSchedules(data);
        }, e=>console.error(e));
        return () => { unZ(); unN(); unS(); };
    }, [user, appId]);

    // ── Derived data ──
    const getZoneName  = useCallback(id => zones.find(z=>z.id===id)?.name || 'DESCONOCIDA', [zones]);
    const getZoneColor = useCallback(id => zones.find(z=>z.id===id)?.color || 'bg-slate-500', [zones]);
    const getZoneHex   = useCallback(id => COLOR_HEX[zones.find(z=>z.id===id)?.color] || '#94a3b8', [zones]);
    const getNodeName  = useCallback(id => nodes.find(n=>n.id===id)?.name || 'NODO ELIMINADO', [nodes]);

    const formatDate = ds => {
        if(!ds) return '';
        return new Date(ds+'T00:00:00Z').toLocaleDateString('es-VE',{weekday:'long',year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).toUpperCase();
    };

    // Stats
    const stats = useMemo(() => {
        const today = TODAY_STR;
        let pending=0, executing=0, overdue=0, done=0;
        schedules.forEach(s => {
            if(s.status==='COMPLETADO') done++;
            else if(s.status==='EN EJECUCION') executing++;
            else if(s.status==='PENDIENTE' && s.date < today) overdue++;
            else if(s.status==='PENDIENTE') pending++;
        });
        return { pending, executing, overdue, done };
    }, [schedules]);

    // Filtered schedules for day detail
    const daySchedules = useMemo(() => {
        return schedules.filter(s => {
            if(s.date !== selDate) return false;
            if(filterZone && s.zoneId !== filterZone) return false;
            if(filterStatus && s.status !== filterStatus) return false;
            if(filterCoord && (s.coordinacion||'OPERACIONES') !== filterCoord) return false;
            return true;
        });
    }, [schedules, selDate, filterZone, filterStatus, filterCoord]);

    // By date map for calendar
    const byDate = useMemo(() => {
        const map = {};
        schedules.forEach(s => {
            if(!map[s.date]) map[s.date] = [];
            map[s.date].push(s);
        });
        return map;
    }, [schedules]);

    const nodesInZone = useMemo(() => nodes.filter(n=>n.zoneId===newSch.zoneId), [nodes, newSch.zoneId]);

    // Upcoming inspections expiring within warnDays
    const upcomingWarnings = useMemo(() => {
        const limit = new Date(TODAY_STR+'T00:00:00Z');
        limit.setUTCDate(limit.getUTCDate() + warnDays);
        return schedules.filter(s => {
            if(s.status !== 'PENDIENTE') return false;
            const d = new Date(s.date+'T00:00:00Z');
            return d >= new Date(TODAY_STR+'T00:00:00Z') && d <= limit;
        }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    }, [schedules, warnDays]);

    // ── Calendar nav ──
    const prevMonth = () => setCurMonth(new Date(curMonth.getFullYear(), curMonth.getMonth()-1, 1));
    const nextMonth = () => setCurMonth(new Date(curMonth.getFullYear(), curMonth.getMonth()+1, 1));
    const goToday   = () => { setCurMonth(new Date()); setSelDate(TODAY_STR); };

    // ── Tooltip via DOM ref (no React state = no re-renders = tooltip stays visible) ──
    // ── Hover Tooltip — Native DOM delegation (immune to React re-renders/remounts) ──
    const tooltipRef  = useRef(null);
    const ttTimer     = useRef(null);
    const ttData      = useRef(null);
    ttData.current    = { byDate, getZoneName, getZoneHex, nodes, filterCoord };

    // Ref callback: re-attaches native listeners every time the grid DOM node changes
    const calGridRef = useCallback(grid => {
        if(!grid) return;

        const onOver = e => {
            const cell = e.target.closest('[data-date]');
            if(!cell || !grid.contains(cell)) return;
            const dateStr = cell.dataset.date;
            const rect    = cell.getBoundingClientRect();
            clearTimeout(ttTimer.current);
            ttTimer.current = setTimeout(() => {
                const { byDate: bd, getZoneName: gZN, getZoneHex: gZH, nodes: nds, filterCoord: fC } = ttData.current;
                const allInspections = bd[dateStr] || [];
                const inspections = fC ? allInspections.filter(s=>(s.coordinacion||'OPERACIONES')===fC) : allInspections;
                const el = tooltipRef.current;
                if(!el || !inspections.length){ if(el) el.style.display='none'; return; }

                const stCfg = s => {
                    const isPast = s.date < TODAY_STR && s.status==='PENDIENTE';
                    if(s.status==='COMPLETADO')   return {label:'✓ COMPLETADO',   color:'#6ee7b7', bg:'rgba(110,231,183,.18)'};
                    if(s.status==='EN EJECUCION') return {label:'● EN EJECUCIÓN', color:'#93c5fd', bg:'rgba(147,197,253,.18)'};
                    if(s.status==='EN PAUSA')     return {label:'⏸ EN PAUSA',     color:'#fcd34d', bg:'rgba(252,211,77,.18)'};
                    if(s.status==='ANULADA')      return {label:'✕ ANULADA',      color:'#fca5a5', bg:'rgba(252,165,165,.18)'};
                    if(isPast)                    return {label:'⚠ VENCIDA',       color:'#f87171', bg:'rgba(239,68,68,.2)'};
                    return                               {label:'○ PENDIENTE',    color:'#fdba74', bg:'rgba(253,186,116,.15)'};
                };

                const dateLabel = new Date(dateStr+'T00:00:00Z')
                    .toLocaleDateString('es-VE',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})
                    .toUpperCase();

                const rows = inspections.map((s, idx) => {
                    const nid    = s.nodeId||(s.nodes&&s.nodes[0]);
                    const hex    = gZH(s.zoneId);
                    const cfg    = stCfg(s);
                    const isZone = s.scope === 'zone';
                    const delay  = (() => {
                        if(s.status!=='PENDIENTE'&&s.status!=='EN PAUSA') return 0;
                        const d = Math.floor((new Date(TODAY_STR+'T00:00:00Z') - new Date(s.date+'T00:00:00Z'))/86400000);
                        return d > 0 ? d : 0;
                    })();
                    const title     = isZone ? `🗂 ${gZN(s.zoneId)}` : (nds.find(n=>n.id===nid)||{}).name||'—';
                    const zoneNodes = isZone ? nds.filter(n=>n.zoneId===s.zoneId).map(n=>n.name).join(' · ') : '';
                    const actT      = getActType(s.activityType||'planificada');
                    const actName   = s.activityName || 'INSPECCIÓN PM';
                    return `<div style="display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07)">
                        <div style="min-width:20px;height:20px;border-radius:50%;background:${actT.color};display:flex;align-items:center;justify-content:center;font-size:.54rem;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px ${hex}">${idx+1}</div>
                        <div style="flex:1;min-width:0">
                            <div style="font-size:.62rem;font-weight:900;color:${actT.color};letter-spacing:.06em;margin-bottom:1px">${actName}</div>
                            <div style="font-family:'JetBrains Mono',monospace;font-size:.67rem;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">${title}</div>
                            ${zoneNodes ? `<div style="font-size:.51rem;color:rgba(255,255,255,.32);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px">${zoneNodes}</div>` : ''}
                            <div style="display:flex;flex-wrap:wrap;gap:3px;align-items:center">
                                <span style="font-size:.55rem;font-weight:800;padding:1px 7px;border-radius:999px;background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.color}44">${cfg.label}</span>
                                ${delay>0 ? `<span style="font-size:.52rem;font-weight:800;color:#fca5a5;background:rgba(239,68,68,.18);padding:1px 6px;border-radius:999px">${delay}D RETRASO</span>` : ''}
                                ${s.odt ? `<span style="font-size:.51rem;font-weight:800;color:#c4b5fd;background:rgba(168,85,247,.15);padding:1px 5px;border-radius:4px">ODT:${s.odt}</span>` : ''}
                            </div>
                            ${s.techs ? `<div style="margin-top:2px;font-size:.51rem;color:rgba(255,255,255,.28);font-weight:600">${s.techs}</div>` : ''}
                        </div>
                    </div>`;
                }).join('');

                el.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px">
                        <div style="font-size:.57rem;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.4)">${dateLabel}</div>
                        <div style="font-size:.57rem;font-weight:800;color:rgba(255,255,255,.3);white-space:nowrap">${inspections.length} INSP.</div>
                    </div>${rows}`;

                const TW = 280;
                let x = rect.left + rect.width/2 - TW/2;
                let y = rect.bottom + 8;
                if(x + TW > window.innerWidth - 8) x = window.innerWidth - TW - 8;
                if(x < 8) x = 8;
                const estH = 70 + inspections.length * 80;
                if(y + estH > window.innerHeight - 8) y = rect.top - estH - 8;
                if(y < 8) y = 8;
                el.style.cssText += `;display:block;left:${x}px;top:${y}px;width:${TW}px`;
            }, 130);
        };

        const onOut = e => {
            const cell = e.target.closest('[data-date]');
            if(!cell) return;
            if(cell.contains(e.relatedTarget)) return;
            clearTimeout(ttTimer.current);
            if(tooltipRef.current) tooltipRef.current.style.display = 'none';
        };

        grid.addEventListener('mouseover', onOver);
        grid.addEventListener('mouseout',  onOut);
        // No cleanup needed since calGridRef callback will receive null when the node unmounts
    }, []);

    // ── CRUD ──
    const db = (col) => {
        const { collection } = window.FirebaseSDK;
        return collection(dbRef.current, 'artifacts', appId, 'public', 'data', col);
    };
    const docRef = (col, id) => { const { doc } = window.FirebaseSDK; return doc(dbRef.current, 'artifacts', appId, 'public', 'data', col, id); };

    const handleAddZone = async e => {
        e.preventDefault(); if(!newZone.name.trim()) return;
        const { addDoc, serverTimestamp } = window.FirebaseSDK;
        try { await addDoc(db('pm_zones'), { name:newZone.name.toUpperCase(), color:newZone.color, createdAt:serverTimestamp() }); setNewZone({name:'',color:ZONE_COLORS[0]}); } catch(e){console.error(e);}
    };
    const handleUpdateZoneColor = async (zoneId, color) => {
        const { updateDoc } = window.FirebaseSDK;
        try { await updateDoc(docRef('pm_zones', zoneId), {color}); } catch(e){console.error(e);}
    };
    const handleAddNode = async e => {
        e.preventDefault(); if(!newNode.name.trim()||!newNode.zoneId) return;
        const { addDoc, serverTimestamp } = window.FirebaseSDK;
        try { await addDoc(db('pm_nodes'), { name:newNode.name.toUpperCase(), zoneId:newNode.zoneId, createdAt:serverTimestamp() }); setNewNode({name:'',zoneId:''}); } catch(e){console.error(e);}
    };
    const deleteItem = async (col, id, name) => {
        if(!confirm(`¿ELIMINAR: ${name}?`)) return;
        const { deleteDoc } = window.FirebaseSDK;
        try { await deleteDoc(docRef(col, id)); } catch(e){console.error(e);}
    };
    const toggleNode = id => {
        const cur = newSch.selectedNodes;
        if(cur.includes(id)) setNewSch({...newSch, selectedNodes:cur.filter(x=>x!==id)});
        else setNewSch({...newSch, selectedNodes:[...cur,id]});
    };

    const handleSaveSchedule = async e => {
        e.preventDefault();
        const isByZone = newSch.scheduleMode === 'zone';
        if(!newSch.date || !newSch.zoneId){ alert("SELECCIONE FECHA Y ZONA."); return; }
        if(!isByZone && newSch.selectedNodes.length===0){ alert("SELECCIONE AL MENOS UN NODO."); return; }
        if(!newSch.activityName.trim()){ alert("INGRESE EL NOMBRE DE LA ACTIVIDAD."); return; }
        if(newSch.recurring && newSch.repeatDays<=0){ alert("INTERVALO DEBE SER > 0."); return; }
        const { serverTimestamp:sTs, writeBatch:wb } = window.FirebaseSDK;
        const batch = wb(dbRef.current);
        const schCol = db('pm_schedules');
        // Recurring: ONE occurrence only — next is auto-created on completion
        const groupId = newSch.recurring ? Date.now().toString() : null;
        const actName = newSch.activityName.trim().toUpperCase();

        // Skip weekends on base date
        let nd = new Date(newSch.date+'T00:00:00Z');
        let dow = nd.getUTCDay();
        if(dow===6) nd.setUTCDate(nd.getUTCDate()+2);
        else if(dow===0) nd.setUTCDate(nd.getUTCDate()+1);
        const ds = nd.toISOString().split('T')[0];

        const baseDoc = {
            activityName:actName, activityType:newSch.activityType, coordinacion:newSch.coordinacion,
            date:ds, zoneId:newSch.zoneId,
            techs:'', odt:'', odtLink:'', reason:'',
            status:'PENDIENTE', createdAt:sTs(),
            isRecurring:newSch.recurring, groupId, repeatDays:newSch.recurring?Number(newSch.repeatDays):null
        };

        if(isByZone){
            const { doc:fd } = window.FirebaseSDK;
            batch.set(fd(schCol), { ...baseDoc, scope:'zone', nodeId:null, nodes:[] });
        } else {
            newSch.selectedNodes.forEach(nodeId => {
                const { doc:fd } = window.FirebaseSDK;
                batch.set(fd(schCol), { ...baseDoc, scope:'node', nodeId, nodes:[nodeId] });
            });
        }

        try {
            await batch.commit();
            setSelDate(ds);
            setNewSch({date:'',zoneId:'',selectedNodes:[],recurring:false,repeatDays:30,scheduleMode:'node',activityName:'',activityType:'planificada',coordinacion:'OPERACIONES'});
            const fd0=new Date(ds+'T00:00:00Z');
            setCurMonth(new Date(fd0.getFullYear(),fd0.getMonth(),1));
            setActiveTab('cronograma');
            const total = isByZone ? 1 : newSch.selectedNodes.length;
            alert(`GUARDADO · ${total} ACTIVIDAD${total!==1?'ES':''} AGENDADA${total!==1?'S':''}`);
        } catch(e){console.error(e);alert("ERROR: "+e.message);}
    };

    // ── activeAction: "id:TYPE" or null — just tracks which card/form is open ──
    const [activeAction, setActiveAction] = useState(null); // e.g. "abc123:START"
    const [activeEdit,   setActiveEdit]   = useState(null); // schedule id

    // Called by SchCard with (id, 'submit', {techs, odt, odtLink}) or just (id) to open
    const handleCardStart = async (id, mode, data) => {
        if(mode !== 'submit'){ setActiveAction(id+':START'); setActiveEdit(null); return; }
        const { techs='', odt='', odtLink='' } = data;
        if(!techs.trim()){ alert("INGRESE LOS TÉCNICOS."); return; }
        const { updateDoc } = window.FirebaseSDK;
        try {
            await updateDoc(docRef('pm_schedules', id), { status:'EN EJECUCION', techs:techs.toUpperCase(), odt:odt.toUpperCase(), odtLink:odtLink.trim(), reason:'' });
            setActiveAction(null);
        } catch(e){ console.error(e); }
    };

    // Called by SchCard with (id, type) to open, or (id, type, 'submit', {reason}) to save
    const handleCardPauseCancel = async (id, type, mode, data) => {
        if(mode !== 'submit'){ setActiveAction(id+':'+type); setActiveEdit(null); return; }
        const { reason='' } = data;
        if(!reason.trim()){ alert("INGRESE EL MOTIVO."); return; }
        const { updateDoc } = window.FirebaseSDK;
        const newStatus = type==='PAUSE' ? 'EN PAUSA' : 'ANULADA';
        try {
            await updateDoc(docRef('pm_schedules', id), { status:newStatus, reason:reason.toUpperCase() });
            setActiveAction(null);
        } catch(e){ console.error(e); }
    };

    // Called by SchCard with (id) to open, or (id, 'submit', {techs, odt, odtLink}) to save
    const handleCardEdit = async (id, mode, data) => {
        if(mode !== 'submit'){ setActiveEdit(id); setActiveAction(null); return; }
        const { techs='', odt='', odtLink='' } = data;
        if(!techs.trim()){ alert("INGRESE LOS TÉCNICOS."); return; }
        const { updateDoc } = window.FirebaseSDK;
        try {
            await updateDoc(docRef('pm_schedules', id), { techs:techs.toUpperCase(), odt:odt.toUpperCase(), odtLink:odtLink.trim() });
            setActiveEdit(null);
        } catch(e){ console.error(e); }
    };

    // Helper: next weekday date string from a base date + N days
    const nextWeekday = (baseDateStr, addDays) => {
        let d = new Date(baseDateStr+'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() + addDays);
        if(d.getUTCDay()===6) d.setUTCDate(d.getUTCDate()+2);
        else if(d.getUTCDay()===0) d.setUTCDate(d.getUTCDate()+1);
        return d.toISOString().split('T')[0];
    };

    const handleStatusChange = async (sch, status) => {
        const { updateDoc, addDoc, serverTimestamp:sTs } = window.FirebaseSDK;
        try {
            let upd = {status};
            if(status==='PENDIENTE') upd.reason='';
            await updateDoc(docRef('pm_schedules', sch.id), upd);

            // Auto-create next occurrence when completing a recurring activity
            if(status==='COMPLETADO' && sch.isRecurring && sch.repeatDays) {
                const nextDate = nextWeekday(sch.date, Number(sch.repeatDays));
                const nextDoc = {
                    activityName: sch.activityName||'INSPECCIÓN PM',
                    activityType: sch.activityType||'planificada',
                    coordinacion: sch.coordinacion||'OPERACIONES',
                    date: nextDate,
                    zoneId: sch.zoneId,
                    scope: sch.scope,
                    nodeId: sch.nodeId||null,
                    nodes: sch.nodes||[],
                    techs:'', odt:'', odtLink:'', reason:'',
                    status:'PENDIENTE',
                    isRecurring: true,
                    groupId: sch.groupId||sch.id,
                    repeatDays: sch.repeatDays,
                    createdAt: sTs(),
                };
                await addDoc(db('pm_schedules'), nextDoc);
            }
        } catch(e){console.error(e);}
    };

    const promptDelete = sch => {
        if(sch.groupId) setDelP({isOpen:true,schedule:sch});
        else deleteItem('pm_schedules', sch.id, 'ESTA PROGRAMACIÓN');
    };
    const confirmDel = async mode => {
        const { deleteDoc:dd, writeBatch:wb } = window.FirebaseSDK;
        try {
            if(mode==='SINGLE'){ await dd(docRef('pm_schedules', delP.schedule.id)); }
            else {
                const list = schedules.filter(s=>s.groupId===delP.schedule.groupId);
                const batch = wb(dbRef.current);
                list.forEach(s=>batch.delete(docRef('pm_schedules',s.id)));
                await batch.commit();
                alert(`${list.length} MANTENIMIENTOS ELIMINADOS.`);
            }
        } catch(e){console.error(e);}
        setDelP({isOpen:false,schedule:null});
    };

    const exportPDF = (rows) => {
        if(!window.jspdf?.jsPDF){alert("PDF cargando...");return;}
        const docPdf = new window.jspdf.jsPDF({orientation:'landscape'});
        if(!rows.length){alert("NO HAY DATOS A EXPORTAR.");return;}
        docPdf.setFontSize(16); docPdf.setTextColor(13,148,136);
        docPdf.text("HISTORIAL DE ACTIVIDADES – AIRTEK ZULIA", 14, 20);
        docPdf.setFontSize(9); docPdf.setTextColor(100,116,139);
        docPdf.text(`Generado: ${new Date().toLocaleDateString('es-VE')}`, 14, 28);
        docPdf.autoTable({
            startY:34,
            head:[['FECHA','ACTIVIDAD','TIPO','COORDINACIÓN','ZONA','NODO','ODT','TÉCNICOS']],
            body:rows.map(s=>{
                const nid = s.nodeId || (s.nodes&&s.nodes[0]);
                const isZone = s.scope === 'zone';
                const nodeStr = isZone
                    ? `ZONA: ${getZoneName(s.zoneId)} (${nodes.filter(n=>n.zoneId===s.zoneId).map(n=>n.name).join(', ')})`
                    : getNodeName(nid);
                const actT = getActType(s.activityType||'planificada');
                return [
                    formatDate(s.date),
                    s.activityName||'INSPECCIÓN PM',
                    actT.label,
                    s.coordinacion||'OPERACIONES',
                    getZoneName(s.zoneId),
                    nodeStr,
                    s.odt||'—',
                    s.techs||'NO REG.'
                ];
            }),
            headStyles:{fillColor:[13,148,136]},
            styles:{fontSize:6.5,cellPadding:3},
            alternateRowStyles:{fillColor:[248,250,252]}
        });
        docPdf.save("Historial_Airtek.pdf");
    };

    const exportExcel = (rows) => {
        if(!window.XLSX){alert("Excel cargando...");return;}
        if(!rows.length){alert("NO HAY DATOS A EXPORTAR.");return;}
        const data = rows.map(s=>{
            const nid = s.nodeId || (s.nodes&&s.nodes[0]);
            const isZone = s.scope === 'zone';
            const nodeStr = isZone
                ? `ZONA COMPLETA: ${getZoneName(s.zoneId)} (${nodes.filter(n=>n.zoneId===s.zoneId).map(n=>n.name).join(', ')})`
                : getNodeName(nid);
            const actT = getActType(s.activityType||'planificada');
            return {
                FECHA:          formatDate(s.date),
                ACTIVIDAD:      s.activityName||'INSPECCIÓN PM',
                TIPO:           actT.label,
                COORDINACIÓN:   s.coordinacion||'OPERACIONES',
                ZONA:           getZoneName(s.zoneId),
                NODO:           nodeStr,
                ODT:            s.odt||'',
                TÉCNICOS:       s.techs||'NO REGISTRADO',
            };
        });
        const ws = window.XLSX.utils.json_to_sheet(data);
        ws['!cols'] = [{wch:28},{wch:28},{wch:20},{wch:22},{wch:18},{wch:28},{wch:14},{wch:30}];
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Historial Airtek');
        window.XLSX.writeFile(wb, 'Historial_Airtek.xlsx');
    };

    // Reschedule: simply update date. Next occurrence will count from new date on completion.
    const handleReschedule = async () => {
        const { sch, newDate } = reschedule;
        if(!newDate){ alert("SELECCIONE UNA NUEVA FECHA."); return; }
        // Skip weekends on chosen date
        let d = new Date(newDate+'T00:00:00Z');
        if(d.getUTCDay()===6) d.setUTCDate(d.getUTCDate()+2);
        else if(d.getUTCDay()===0) d.setUTCDate(d.getUTCDate()+1);
        const finalDate = d.toISOString().split('T')[0];
        const { updateDoc } = window.FirebaseSDK;
        try {
            await updateDoc(docRef('pm_schedules', sch.id), { date:finalDate, status:'PENDIENTE', reason:'' });
            setReschedule({ open:false, sch:null, newDate:'' });
        } catch(e){ console.error(e); alert("ERROR: "+e.message); }
    };

    // ════════════════════════════════════════════
    // CALENDAR COMPONENT
    // ════════════════════════════════════════════
    const Calendar = () => {
        const year  = curMonth.getFullYear();
        const month = curMonth.getMonth();
        const firstDay = new Date(year,month,1).getDay();
        const days     = new Date(year,month+1,0).getDate();
        const cells = [];
        for(let i=0;i<firstDay;i++) cells.push(null);
        for(let i=1;i<=days;i++)    cells.push(i);

        // check if any day in view has overdue
        const hasOverdueInRange = cells.some(d => {
            if(!d) return false;
            const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            return (byDate[ds]||[]).some(s=>s.status==='PENDIENTE'&&ds<TODAY_STR);
        });

        return (
            <div className="card card-xl p-4 sm:p-5" style={{position:'relative'}}>
                {delP.isOpen && (
                    <div className="del-overlay">
                        <div className="del-modal">
                            <div style={{width:48,height:48,background:'#fef2f2',color:'#ef4444',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><TrashIco /></div>
                            <div style={{fontSize:'.68rem',fontWeight:900,marginBottom:6}}>TAREA RECURRENTE</div>
                            <div style={{fontSize:'.6rem',color:'var(--muted)',lineHeight:1.5,marginBottom:18}}>Esta actividad es recurrente. ¿Qué deseas eliminar?</div>
                            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                <button onClick={()=>confirmDel('SERIES')} className="btn" style={{background:'#ef4444',color:'#fff',width:'100%',padding:'12px',boxShadow:'0 3px 12px rgba(239,68,68,.3)'}}>ELIMINAR TODA LA SERIE</button>
                                <button onClick={()=>confirmDel('SINGLE')} className="btn btn-pause" style={{width:'100%',padding:'12px'}}>SOLO ESTA FECHA</button>
                                <button onClick={()=>setDelP({isOpen:false,schedule:null})} className="btn btn-reopen" style={{width:'100%',padding:'10px',marginTop:4}}>CANCELAR</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Header */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                    <button onClick={prevMonth} className="btn btn-reopen" style={{padding:'7px',borderRadius:'10px'}}><ChevL /></button>
                    <div style={{textAlign:'center'}}>
                        <div className="cal-hdr">{MONTH_NAMES[month]} {year}</div>
                        {hasOverdueInRange && <div style={{fontSize:'.55rem',color:'#ef4444',fontWeight:800,letterSpacing:'.1em',marginTop:2}}>⚠ HAY TAREAS VENCIDAS</div>}
                    </div>
                    <button onClick={nextMonth} className="btn btn-reopen" style={{padding:'7px',borderRadius:'10px'}}><ChevR /></button>
                </div>

                {/* Day labels */}
                <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px',marginBottom:4}}>
                    {['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'].map(d=>(
                        <div key={d} className="cal-day-lbl">{d}</div>
                    ))}
                </div>

                {/* Cells — calGridRef enables native delegated mouseover for tooltip */}
                <div ref={calGridRef} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px'}}>
                        {cells.map((day,idx) => {
                        if(!day) return <div key={`e${idx}`} />;
                        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                        const ds_scheds  = (byDate[ds]||[]).filter(s => !filterCoord || (s.coordinacion||'OPERACIONES')===filterCoord);
                        const isSelected = selDate===ds;
                        const isToday    = TODAY_STR===ds;
                        const hasOverdue = ds_scheds.some(s=>s.status==='PENDIENTE'&&ds<TODAY_STR);

                        return (
                            <div
                                key={idx}
                                data-date={ds}
                                onClick={()=>setSelDate(ds)}
                                className={`cal-cell${isSelected?' cal-active':''}`}
                            >
                                {hasOverdue && <span className="cell-overdue-dot" />}
                                <div className={`cal-num ${isToday?'cal-num-today':isSelected?'cal-num-selected':'cal-num-normal'}`}>{day}</div>
                                <div className="cal-dots">
                                    {ds_scheds.map((s,i) => {
                                        // Status colors override activityType for non-pending
                                        const statusColor = s.status==='ANULADA'?'#fca5a5':s.status==='EN PAUSA'?'#fcd34d':s.status==='EN EJECUCION'?'#93c5fd':s.status==='COMPLETADO'?'#6ee7b7':null;
                                        const typeColor   = getActType(s.activityType||'planificada').color;
                                        const dotColor    = statusColor || typeColor;
                                        const zoneRing    = getZoneHex(s.zoneId);
                                        return (
                                            <div
                                                key={i}
                                                className={`cal-dot ${s.status==='EN EJECUCION'?'animate-pulse':''}`}
                                                style={{background:dotColor, boxShadow:`0 0 0 2px ${zoneRing}`}}
                                            />
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })}
                </div>

                {/* Legend */}
                <div style={{display:'flex',flexWrap:'wrap',gap:'10px',marginTop:14,paddingTop:12,borderTop:'1px solid var(--border)'}}>
                    {ACTIVITY_TYPES.map(t=>(
                        <div key={t.id} style={{display:'flex',alignItems:'center',gap:5}}>
